<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional Dark 3D Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D Glass Card Effect -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
    </linearGradient>
    
    <!-- Spring Boot Accent Gradient -->
    <linearGradient id="springAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6db33f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8bc34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
    
    <!-- Streaming Tech Gradient -->
    <linearGradient id="streamAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8a50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    
    <!-- Tech Glow -->
    <filter id="techGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 3D Shadow Filter -->
    <filter id="shadow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Professional Dark Background -->
  <rect width="800" height="400" fill="url(#darkBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Tech Elements Background -->
  <g opacity="0.4" filter="url(#techGlow)">
    <!-- Data Flow Lines -->
    <path d="M 100 150 Q 200 100 300 150 Q 400 200 500 150 Q 600 100 700 150" 
          stroke="url(#springAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 100 250 Q 200 200 300 250 Q 400 300 500 250 Q 600 200 700 250" 
          stroke="url(#streamAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Floating Geometric Elements -->
    <circle cx="120" cy="80" r="6" fill="url(#springAccent)"/>
    <rect x="680" y="320" width="12" height="12" rx="2" fill="url(#streamAccent)" transform="rotate(45 686 326)"/>
    <circle cx="750" cy="100" r="4" fill="url(#springAccent)"/>
    <circle cx="50" cy="350" r="5" fill="url(#streamAccent)"/>
  </g>
  
  <!-- Main 3D Glass Card -->
  <g filter="url(#shadow3d)">
    <rect x="60" y="70" width="680" height="260" rx="24" fill="url(#glassCard)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="60" y="70" width="680" height="1" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Modern Spring Boot Icon with 3D Effect -->
  <g transform="translate(120, 130)" filter="url(#techGlow)">
    <circle cx="20" cy="20" r="26" fill="rgba(109,179,63,0.3)" stroke="url(#springAccent)" stroke-width="2"/>
    <circle cx="20" cy="20" r="20" fill="url(#springAccent)"/>
    <path d="M 12 12 Q 20 8 28 12 Q 20 16 12 12" fill="white" opacity="0.9"/>
    <path d="M 12 20 Q 20 16 28 20 Q 20 24 12 20" fill="white" opacity="0.9"/>
    <path d="M 12 28 Q 20 24 28 28 Q 20 32 12 28" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Video Streaming Icon with Modern Design -->
  <g transform="translate(560, 130)" filter="url(#techGlow)">
    <rect x="0" y="8" width="50" height="32" rx="8" fill="rgba(255,107,53,0.3)" stroke="url(#streamAccent)" stroke-width="2"/>
    <rect x="2" y="10" width="46" height="28" rx="6" fill="url(#streamAccent)"/>
    <polygon points="18,18 18,30 30,24" fill="white"/>
    <circle cx="40" cy="15" r="3" fill="#ff4444"/>
    <rect x="8" y="0" width="34" height="6" rx="3" fill="rgba(255,107,53,0.4)"/>
  </g>
  
  <!-- Modern Database Icon -->
  <g transform="translate(480, 135)" filter="url(#techGlow)">
    <ellipse cx="20" cy="8" rx="18" ry="6" fill="rgba(255,152,0,0.3)" stroke="#ff9800" stroke-width="2"/>
    <ellipse cx="20" cy="8" rx="15" ry="4" fill="#ff9800"/>
    <rect x="5" y="8" width="30" height="16" fill="url(#streamAccent)" opacity="0.8"/>
    <ellipse cx="20" cy="24" rx="15" ry="4" fill="#ff9800"/>
    <ellipse cx="20" cy="16" rx="15" ry="4" fill="#ffb74d"/>
  </g>
  
  <!-- Java Platform Icon -->
  <g transform="translate(320, 135)" filter="url(#techGlow)">
    <rect x="0" y="0" width="40" height="30" rx="8" fill="rgba(255,87,34,0.3)" stroke="#ff5722" stroke-width="2"/>
    <rect x="2" y="2" width="36" height="26" rx="6" fill="#ff5722"/>
    <text x="20" y="20" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="700">J</text>
  </g>
  
  <!-- Main Title with Professional Typography -->
  <text x="400" y="210" text-anchor="middle" fill="rgba(255,255,255,0.95)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    Mastering Spring Boot
  </text>
  <text x="400" y="240" text-anchor="middle" fill="url(#streamAccent)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
    Scalable Video Streaming APIs
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="270" text-anchor="middle" fill="rgba(255,255,255,0.7)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    File Handling, Optimization &amp; Database Design Patterns
  </text>
  
  <!-- Modern Feature Pills -->
  <g transform="translate(120, 300)">
    <rect width="100" height="24" rx="12" fill="rgba(109,179,63,0.2)" stroke="rgba(109,179,63,0.4)" stroke-width="1"/>
    <text x="50" y="16" text-anchor="middle" fill="#6db33f" font-family="system-ui" font-size="12" font-weight="600">Spring Boot</text>
  </g>
  
  <g transform="translate(240, 300)">
    <rect width="85" height="24" rx="12" fill="rgba(255,107,53,0.2)" stroke="rgba(255,107,53,0.4)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" fill="#ff6b35" font-family="system-ui" font-size="12" font-weight="600">Streaming</text>
  </g>
  
  <g transform="translate(345, 300)">
    <rect width="75" height="24" rx="12" fill="rgba(255,152,0,0.2)" stroke="rgba(255,152,0,0.4)" stroke-width="1"/>
    <text x="37.5" y="16" text-anchor="middle" fill="#ff9800" font-family="system-ui" font-size="12" font-weight="600">MySQL</text>
  </g>
  
  <g transform="translate(440, 300)">
    <rect width="80" height="24" rx="12" fill="rgba(255,87,34,0.2)" stroke="rgba(255,87,34,0.4)" stroke-width="1"/>
    <text x="40" y="16" text-anchor="middle" fill="#ff5722" font-family="system-ui" font-size="12" font-weight="600">REST API</text>
  </g>
  
  <g transform="translate(540, 300)">
    <rect width="75" height="24" rx="12" fill="rgba(109,179,63,0.2)" stroke="rgba(109,179,63,0.4)" stroke-width="1"/>
    <text x="37.5" y="16" text-anchor="middle" fill="#6db33f" font-family="system-ui" font-size="12" font-weight="600">Java</text>
  </g>
</svg>
