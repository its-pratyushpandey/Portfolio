<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional dark streaming gradient background -->
    <linearGradient id="streaming-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1b263b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#415a77;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#778da9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dark 3D glass effect for modern look -->
    <linearGradient id="glass-modern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="30%" style="stop-color:#6b73ff;stop-opacity:0.12" />
      <stop offset="70%" style="stop-color:#9b59b6;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Spring Boot green gradient -->
    <radialGradient id="spring-3d" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#6db33f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5a9a32;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4a7c28;stop-opacity:0.7" />
    </radialGradient>
    
    <!-- Streaming data gradient -->
    <linearGradient id="stream-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 3D depth shadow -->
    <filter id="depth-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#6b73ff" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9b59b6" flood-opacity="0.3"/>
    </filter>
    
    <!-- Streaming glow effect -->
    <filter id="stream-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- 3D bevel effect for depth -->
    <filter id="bevel-3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feSpecularLighting result="specOut" lighting-color="white" specularConstant="1.5" specularExponent="20">
        <fePointLight x="-50" y="-50" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    
    <!-- Data flow pattern -->
    <pattern id="data-flow" x="0" y="0" width="30" height="20" patternUnits="userSpaceOnUse">
      <rect width="30" height="20" fill="none"/>
      <circle cx="5" cy="10" r="2" fill="#4ecdc4" opacity="0.7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="10" r="2" fill="#45b7d1" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="25" cy="10" r="2" fill="#ff6b6b" opacity="0.6">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>
  
  <!-- Professional streaming background -->
  <rect width="800" height="400" fill="url(#streaming-bg)"/>
  
  <!-- Floating 3D architectural elements -->
  <g opacity="0.12">
    <!-- 3D server racks -->
    <g transform="translate(60,80)">
      <rect x="0" y="0" width="20" height="40" fill="#6db33f" opacity="0.8"/>
      <rect x="3" y="3" width="14" height="34" fill="#ffffff" opacity="0.6"/>
      <rect x="6" y="8" width="8" height="4" fill="#6db33f" opacity="0.9"/>
      <rect x="6" y="18" width="8" height="4" fill="#6db33f" opacity="0.9"/>
      <rect x="6" y="28" width="8" height="4" fill="#6db33f" opacity="0.9"/>
    </g>
    
    <!-- 3D API nodes -->
    <g transform="translate(650,120)">
      <circle cx="15" cy="15" r="12" fill="#4ecdc4" opacity="0.6"/>
      <circle cx="15" cy="15" r="8" fill="#ffffff" opacity="0.8"/>
      <text x="15" y="19" text-anchor="middle" fill="#0d1b2a" font-family="Arial, sans-serif" font-size="8" font-weight="bold">API</text>
    </g>
    
    <!-- 3D streaming pipes -->
    <g transform="translate(200,320)">
      <rect x="0" y="5" width="60" height="8" rx="4" fill="#45b7d1" opacity="0.6"/>
      <rect x="5" y="7" width="50" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Main 3D glassmorphism container -->
  <g transform="translate(50,50)">
    <!-- Multiple shadow layers for professional depth -->
    <rect x="20" y="20" width="680" height="300" rx="30" fill="#6b73ff" opacity="0.15" filter="url(#depth-shadow)"/>
    <rect x="15" y="15" width="680" height="300" rx="30" fill="#9b59b6" opacity="0.1"/>
    <rect x="10" y="10" width="680" height="300" rx="30" fill="#4ecdc4" opacity="0.08"/>
    
    <!-- Main glass surface -->
    <rect x="0" y="0" width="680" height="300" rx="25" fill="url(#glass-modern)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#stream-glow)"/>
    
    <!-- 3D Spring Boot logo with leaf -->
    <g transform="translate(80,90)">
      <!-- Spring leaf icon with 3D effect -->
      <g filter="url(#bevel-3d)">
        <circle cx="40" cy="40" r="35" fill="url(#spring-3d)"/>
        <circle cx="40" cy="40" r="30" fill="#6db33f" opacity="0.9"/>
        
        <!-- Stylized Spring leaf -->
        <path d="M25 40 Q40 25 55 40 Q40 55 25 40 Z" fill="#ffffff" opacity="0.9"/>
        <path d="M30 40 Q40 30 50 40 Q40 50 30 40 Z" fill="#6db33f" opacity="0.7"/>
        
        <!-- Spring text -->
        <text x="40" y="65" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SPRING</text>
      </g>
      
      <!-- Floating animation -->
      <animateTransform attributeName="transform" type="translate" values="80,90; 80,80; 80,90" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D Video streaming visualization -->
    <g transform="translate(480,80)">
      <!-- Video player frame with 3D depth -->
      <g filter="url(#bevel-3d)">
        <rect x="0" y="0" width="120" height="80" rx="12" fill="#1a1a1a" opacity="0.9"/>
        <rect x="5" y="5" width="110" height="70" rx="8" fill="#0d1b2a"/>
        
        <!-- Video streaming bars -->
        <rect x="15" y="15" width="90" height="50" rx="4" fill="url(#data-flow)"/>
        
        <!-- Play button -->
        <polygon points="45,35 45,45 55,40" fill="#ffffff" opacity="0.9"/>
        <circle cx="50" cy="40" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      </g>
      
      <!-- Streaming particles -->
      <g opacity="0.8">
        <circle cx="20" cy="100" r="2" fill="#ff6b6b">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,0" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="60" cy="100" r="2" fill="#4ecdc4">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-25; 0,0" dur="1.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="100" cy="100" r="2" fill="#45b7d1">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-35; 0,0" dur="2.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    
    <!-- 3D floating code elements -->
    <g transform="translate(220,60)" opacity="0.7">
      <!-- REST API endpoints -->
      <text x="0" y="30" fill="#6db33f" font-family="Monaco, Consolas, monospace" font-size="14" font-weight="bold">@RestController</text>
      <text x="2" y="32" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="14" font-weight="bold" opacity="0.4">@RestController</text>
      
      <text x="20" y="55" fill="#4ecdc4" font-family="Monaco, Consolas, monospace" font-size="12">@PostMapping("/stream")</text>
      <text x="22" y="57" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="12" opacity="0.3">@PostMapping("/stream")</text>
      
      <text x="40" y="80" fill="#ff6b6b" font-family="Monaco, Consolas, monospace" font-size="12">ResponseEntity&lt;Video&gt;</text>
      <text x="42" y="82" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="12" opacity="0.3">ResponseEntity&lt;Video&gt;</text>
    </g>
    
    <!-- 3D gradient titles with depth -->
    <g transform="translate(340,160)">
      <!-- Shadow text for depth -->
      <text x="5" y="5" text-anchor="middle" fill="#6b73ff" font-family="Arial, sans-serif" font-size="36" font-weight="900" opacity="0.3">
        Spring Boot Streaming
      </text>
      <!-- Main title -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="900">
        Spring Boot Streaming
      </text>
      <!-- Highlight overlay -->
      <text x="-2" y="-2" text-anchor="middle" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="36" font-weight="900" opacity="0.7">
        Spring Boot Streaming
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(340,200)">
      <text x="2" y="2" text-anchor="middle" fill="#9b59b6" font-family="Arial, sans-serif" font-size="22" font-weight="600" opacity="0.4">
        Scalable Video APIs
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="600">
        Scalable Video APIs
      </text>
    </g>
    
    <!-- 3D description -->
    <text x="340" y="235" text-anchor="middle" fill="#e1f5fe" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
      Building robust streaming APIs with Spring Boot and MySQL
    </text>
    
    <!-- 3D decorative streaming data visualization -->
    <g transform="translate(100,220)" opacity="0.4">
      <rect x="0" y="0" width="480" height="50" rx="8" fill="#000000" opacity="0.6"/>
      <rect x="2" y="-2" width="480" height="50" rx="8" fill="#1a1a1a" opacity="0.4"/>
      
      <!-- Streaming data bars -->
      <rect x="20" y="15" width="8" height="20" fill="#ff6b6b" opacity="0.8">
        <animate attributeName="height" values="20;10;25;15;20" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="35" y="12" width="8" height="26" fill="#4ecdc4" opacity="0.8">
        <animate attributeName="height" values="26;18;30;22;26" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="50" y="18" width="8" height="14" fill="#45b7d1" opacity="0.8">
        <animate attributeName="height" values="14;8;18;12;14" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="65" y="10" width="8" height="30" fill="#6db33f" opacity="0.8">
        <animate attributeName="height" values="30;22;35;28;30" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      
      <text x="400" y="25" fill="#4ecdc4" font-family="Monaco, Consolas, monospace" font-size="12">
        Streaming: 1.2MB/s
      </text>
    </g>
  </g>
  
  <!-- 3D floating streaming particles -->
  <g opacity="0.6">
    <circle cx="140" cy="90" r="3" fill="#ff6b6b">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,-12; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="200" r="2.5" fill="#4ecdc4">
      <animateTransform attributeName="transform" type="translate" values="0,0; -20,15; 0,0" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="340" r="4" fill="#45b7d1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,18; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D light streaming rays -->
  <g opacity="0.15">
    <polygon points="0,0 800,0 750,60 50,60" fill="url(#streaming-bg)"/>
    <polygon points="0,400 800,400 750,340 50,340" fill="url(#streaming-bg)"/>
  </g>
</svg>
