<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional developer gradient -->
    <linearGradient id="dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
    
    <!-- Career path gradient -->
    <linearGradient id="path-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a56;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fad0c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9a56;stop-opacity:1" />
    </linearGradient>
    
    <!-- Success story glass -->
    <linearGradient id="success-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#fad0c4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.15" />
    </linearGradient>
    
    <!-- Achievement glow -->
    <radialGradient id="achievement-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ff9a56;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:0.2" />
    </radialGradient>
    
    <!-- Professional glow filter -->
    <filter id="professional-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- 3D career emboss -->
    <filter id="career-emboss" x="-50%" y="-50%" width="200%" height="200%">
      <feConvolveMatrix order="3" kernelMatrix="2 1 0 1 1 -1 0 -1 -2"/>
      <feOffset dx="2" dy="2"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.3"/>
      <feComposite operator="multiply"/>
    </filter>
    
    <!-- Timeline gradient -->
    <linearGradient id="timeline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#4ecdc4;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#45b7d1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#96ceb4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Professional background -->
  <rect width="800" height="400" fill="url(#dev-bg)"/>
  
  <!-- Career journey geometric elements -->
  <g opacity="0.15">
    <!-- 3D stepping stones (career milestones) -->
    <g transform="translate(100,80)">
      <!-- Student phase -->
      <ellipse cx="0" cy="40" rx="25" ry="15" fill="#ff6b6b" opacity="0.7" transform="rotateX(60deg)"/>
      <ellipse cx="0" cy="35" rx="25" ry="15" fill="#ff9999" opacity="0.5"/>
      
      <!-- Learning phase -->
      <ellipse cx="80" cy="35" rx="30" ry="18" fill="#4ecdc4" opacity="0.8" transform="rotateX(60deg)"/>
      <ellipse cx="80" cy="30" rx="30" ry="18" fill="#7dd3d3" opacity="0.6"/>
      
      <!-- Professional phase -->
      <ellipse cx="160" cy="30" rx="35" ry="20" fill="#45b7d1" opacity="0.9" transform="rotateX(60deg)"/>
      <ellipse cx="160" cy="25" rx="35" ry="20" fill="#6fc5e1" opacity="0.7"/>
    </g>
    
    <!-- 3D growth arrows -->
    <g transform="translate(600,100)">
      <polygon points="0,40 20,20 40,40 30,40 30,60 10,60 10,40" fill="url(#path-gradient)" opacity="0.6"/>
      <polygon points="2,42 18,24 38,42 28,42 28,58 12,58 12,42" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Main professional story panel -->
  <g transform="translate(60,60)">
    <!-- Multiple depth layers for professional look -->
    <rect x="15" y="15" width="650" height="280" rx="25" fill="#ff9a56" opacity="0.1"/>
    <rect x="10" y="10" width="650" height="280" rx="25" fill="#fad0c4" opacity="0.08"/>
    <rect x="5" y="5" width="650" height="280" rx="25" fill="#ffffff" opacity="0.05"/>
    
    <!-- Main professional surface -->
    <rect x="0" y="0" width="650" height="280" rx="20" fill="url(#success-glass)" 
          stroke="rgba(255,154,86,0.4)" stroke-width="2" filter="url(#professional-glow)"/>
    
    <!-- Career timeline visualization -->
    <g transform="translate(50,40)">
      <!-- Timeline base -->
      <rect x="0" y="50" width="500" height="8" rx="4" fill="url(#timeline)" filter="url(#career-emboss)"/>
      
      <!-- Career milestone markers -->
      <g>
        <!-- Student milestone -->
        <circle cx="50" cy="54" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="3"/>
        <text x="50" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2020</text>
        <text x="50" y="80" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="10">Student</text>
        
        <!-- Intern milestone -->
        <circle cx="150" cy="54" r="14" fill="#4ecdc4" stroke="#ffffff" stroke-width="3"/>
        <text x="150" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2021</text>
        <text x="150" y="80" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="10">Intern</text>
        
        <!-- Junior Dev milestone -->
        <circle cx="280" cy="54" r="16" fill="#45b7d1" stroke="#ffffff" stroke-width="3"/>
        <text x="280" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2022</text>
        <text x="280" y="80" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="10">Junior Dev</text>
        
        <!-- Full-Stack milestone -->
        <circle cx="420" cy="54" r="18" fill="url(#achievement-glow)" stroke="#ffffff" stroke-width="3"/>
        <text x="420" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2024</text>
        <text x="420" y="80" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="10">Full-Stack</text>
        
        <!-- Animated progress indicator -->
        <circle cx="420" cy="54" r="22" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6">
          <animate attributeName="r" values="22;26;22" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    
    <!-- Skills evolution visualization -->
    <g transform="translate(80,130)">
      <!-- Skill progress bars with 3D effect -->
      <g>
        <text x="0" y="15" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="600">JavaScript</text>
        <rect x="100" y="5" width="200" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
        <rect x="100" y="5" width="180" height="8" rx="4" fill="#ffd700">
          <animate attributeName="width" values="0;180;180" dur="3s" begin="0s"/>
        </rect>
        
        <text x="0" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="600">React</text>
        <rect x="100" y="30" width="200" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
        <rect x="100" y="30" width="160" height="8" rx="4" fill="#4ecdc4">
          <animate attributeName="width" values="0;160;160" dur="3s" begin="0.5s"/>
        </rect>
        
        <text x="0" y="65" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="600">Node.js</text>
        <rect x="100" y="55" width="200" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
        <rect x="100" y="55" width="150" height="8" rx="4" fill="#45b7d1">
          <animate attributeName="width" values="0;150;150" dur="3s" begin="1s"/>
        </rect>
        
        <text x="0" y="90" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="600">Problem Solving</text>
        <rect x="100" y="80" width="200" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
        <rect x="100" y="80" width="190" height="8" rx="4" fill="#96ceb4">
          <animate attributeName="width" values="0;190;190" dur="3s" begin="1.5s"/>
        </rect>
      </g>
    </g>
    
    <!-- Achievement showcase -->
    <g transform="translate(400,130)">
      <!-- Achievement cards -->
      <rect x="0" y="0" width="80" height="60" rx="8" fill="rgba(255,215,0,0.2)" stroke="#ffd700" stroke-width="1"/>
      <text x="40" y="20" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="24">🏆</text>
      <text x="40" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">5+ Projects</text>
      <text x="40" y="50" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="9">Completed</text>
      
      <rect x="90" y="0" width="80" height="60" rx="8" fill="rgba(76,205,196,0.2)" stroke="#4ecdc4" stroke-width="1"/>
      <text x="130" y="20" text-anchor="middle" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="24">💡</text>
      <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Innovation</text>
      <text x="130" y="50" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="9">Mindset</text>
    </g>
    
    <!-- 3D journey title -->
    <g transform="translate(325,200)">
      <!-- Shadow layers for depth -->
      <text x="3" y="3" text-anchor="middle" fill="#1e3c72" font-family="Arial, sans-serif" font-size="36" font-weight="900" opacity="0.4">
        My Developer Journey
      </text>
      <text x="-1" y="1" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="36" font-weight="900" opacity="0.6">
        My Developer Journey
      </text>
      <!-- Main title -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="900" filter="url(#professional-glow)">
        My Developer Journey
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(325,235)">
      <text x="1" y="1" text-anchor="middle" fill="#ff9a56" font-family="Arial, sans-serif" font-size="22" font-weight="600" opacity="0.7">
        From Student to Full-Stack Developer
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#fad0c4" font-family="Arial, sans-serif" font-size="22" font-weight="600">
        From Student to Full-Stack Developer
      </text>
    </g>
    
    <!-- Inspirational tagline -->
    <text x="325" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
      Every expert was once a beginner - Here's my story of growth and persistence
    </text>
  </g>
  
  <!-- Floating motivational elements -->
  <g opacity="0.8">
    <!-- Floating achievements -->
    <g transform="translate(140,120)">
      <text x="0" y="0" fill="#ffd700" font-family="Arial, sans-serif" font-size="16" font-weight="bold">⭐</text>
      <animateTransform attributeName="transform" type="translate" values="140,120; 150,110; 140,120" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(620,200)">
      <text x="0" y="0" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🚀</text>
      <animateTransform attributeName="transform" type="translate" values="620,200; 610,190; 620,200" dur="4s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(180,300)">
      <text x="0" y="0" fill="#96ceb4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">💻</text>
      <animateTransform attributeName="transform" type="translate" values="180,300; 190,310; 180,300" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Professional growth indicators -->
  <g opacity="0.3">
    <!-- Growth trend lines -->
    <path d="M50,350 Q200,300 400,250 T750,200" stroke="url(#path-gradient)" stroke-width="2" fill="none">
      <animate attributeName="stroke-dasharray" values="0,1000;500,500;1000,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Success particles -->
  <g opacity="0.6">
    <circle cx="300" cy="100" r="2" fill="#ffd700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-15; 0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="180" r="1.5" fill="#ff9a56">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,12; 0,0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="320" r="2.5" fill="#4ecdc4">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,8; 0,0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
