<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Real-time collaboration dark theme -->
    <linearGradient id="realtime-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0b2e;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7b2cbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a189a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Django gradient -->
    <linearGradient id="django-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4b33;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a3d29;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#092e20;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- WebSocket connection gradient -->
    <radialGradient id="websocket-3d" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#8338ec;stop-opacity:0.9" />
      <stop offset="80%" style="stop-color:#3a86ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06ffa5;stop-opacity:0.7" />
    </radialGradient>
    
    <!-- Professional glass effect -->
    <linearGradient id="glass-collab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.16" />
      <stop offset="30%" style="stop-color:#ff006e;stop-opacity:0.10" />
      <stop offset="70%" style="stop-color:#8338ec;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
    
    <!-- Code editor gradient -->
    <linearGradient id="editor-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#282c34;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e2227;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#161a1f;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 3D collaboration glow -->
    <filter id="collab-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Professional depth shadow -->
    <filter id="depth-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#8338ec" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff006e" flood-opacity="0.3"/>
    </filter>
    
    <!-- 3D emboss for depth */
    <filter id="emboss-3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feSpecularLighting result="specOut" lighting-color="white" specularConstant="2" specularExponent="25">
        <fePointLight x="-60" y="-60" z="250"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    
    <!-- Data flow pattern for WebSocket -->
    <pattern id="data-flow" x="0" y="0" width="50" height="30" patternUnits="userSpaceOnUse">
      <rect width="50" height="30" fill="none"/>
      <circle cx="10" cy="15" r="2" fill="#ff006e" opacity="0.7">
        <animate attributeName="cx" values="10;40;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="25" cy="8" r="1.5" fill="#8338ec" opacity="0.6">
        <animate attributeName="cx" values="25;45;25" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="22" r="1.8" fill="#3a86ff" opacity="0.8">
        <animate attributeName="cx" values="15;35;15" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>
  
  <!-- Professional collaboration background -->
  <rect width="800" height="400" fill="url(#realtime-bg)"/>
  
  <!-- WebSocket data flow overlay -->
  <g opacity="0.06">
    <rect width="100%" height="100%" fill="url(#data-flow)"/>
  </g>
  
  <!-- Floating 3D collaborative elements -->
  <g opacity="0.14">
    <!-- User nodes -->
    <g transform="translate(80,80)">
      <circle cx="15" cy="15" r="12" fill="#ff006e" opacity="0.7"/>
      <circle cx="15" cy="15" r="8" fill="#ffffff" opacity="0.5"/>
      <text x="15" y="19" text-anchor="middle" fill="#1a0b2e" font-family="Arial, sans-serif" font-size="8" font-weight="bold">U1</text>
    </g>
    
    <!-- Code blocks -->
    <g transform="translate(680,100)">
      <rect x="0" y="0" width="25" height="20" rx="4" fill="#8338ec" opacity="0.6"/>
      <rect x="3" y="3" width="19" height="14" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="6" y="6" width="6" height="2" fill="#8338ec" opacity="0.8"/>
      <rect x="6" y="10" width="10" height="2" fill="#8338ec" opacity="0.6"/>
    </g>
    
    <!-- Connection lines -->
    <g transform="translate(200,320)">
      <line x1="0" y1="10" x2="40" y2="10" stroke="#3a86ff" stroke-width="3" opacity="0.5"/>
      <circle cx="5" cy="10" r="3" fill="#3a86ff" opacity="0.7"/>
      <circle cx="35" cy="10" r="3" fill="#06ffa5" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Main 3D container -->
  <g transform="translate(50,50)">
    <!-- Professional shadow layers -->
    <rect x="20" y="20" width="680" height="300" rx="30" fill="#8338ec" opacity="0.15" filter="url(#depth-shadow)"/>
    <rect x="15" y="15" width="680" height="300" rx="30" fill="#ff006e" opacity="0.1"/>
    <rect x="10" y="10" width="680" height="300" rx="30" fill="#3a86ff" opacity="0.08"/>
    
    <!-- Main glass surface -->
    <rect x="0" y="0" width="680" height="300" rx="25" fill="url(#glass-collab)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#collab-glow)"/>
    
    <!-- 3D Django logo -->
    <g transform="translate(70,80)">
      <g filter="url(#emboss-3d)">
        <!-- Django green background -->
        <rect x="0" y="0" width="100" height="70" rx="15" fill="url(#django-3d)"/>
        <rect x="5" y="5" width="90" height="60" rx="12" fill="#0c4b33" opacity="0.9"/>
        
        <!-- Django text -->
        <text x="50" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Django</text>
        <text x="50" y="52" text-anchor="middle" fill="#06ffa5" font-family="Arial, sans-serif" font-size="10" font-weight="normal">The Web Framework</text>
      </g>
      
      <!-- Floating animation -->
      <animateTransform attributeName="transform" type="translate" values="70,80; 70,70; 70,80" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D Code Editor with real-time collaboration -->
    <g transform="translate(450,70)">
      <g filter="url(#emboss-3d)">
        <!-- Editor window -->
        <rect x="0" y="0" width="150" height="100" rx="12" fill="url(#editor-3d)"/>
        <rect x="3" y="3" width="144" height="94" rx="9" fill="#282c34" opacity="0.95"/>
        
        <!-- Editor header -->
        <rect x="3" y="3" width="144" height="20" rx="9" fill="#21252b" opacity="0.9"/>
        <circle cx="15" cy="13" r="3" fill="#ff5f56" opacity="0.8"/>
        <circle cx="25" cy="13" r="3" fill="#ffbd2e" opacity="0.8"/>
        <circle cx="35" cy="13" r="3" fill="#27ca3f" opacity="0.8"/>
        
        <!-- Code lines with syntax highlighting -->
        <rect x="10" y="30" width="80" height="3" fill="#61dafb" opacity="0.8"/>
        <rect x="15" y="38" width="60" height="3" fill="#c678dd" opacity="0.7"/>
        <rect x="12" y="46" width="70" height="3" fill="#98c379" opacity="0.6"/>
        <rect x="18" y="54" width="55" height="3" fill="#e06c75" opacity="0.8"/>
        
        <!-- Real-time cursors from other users -->
        <rect x="45" y="37" width="2" height="4" fill="#ff006e" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1s" repeatCount="indefinite"/>
        </rect>
        <rect x="35" y="53" width="2" height="4" fill="#8338ec" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        
        <!-- User indicators -->
        <circle cx="130" cy="40" r="4" fill="#ff006e" opacity="0.8"/>
        <text x="130" y="44" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="6">U1</text>
        <circle cx="130" cy="55" r="4" fill="#8338ec" opacity="0.8"/>
        <text x="130" y="59" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="6">U2</text>
      </g>
      
      <!-- Editor floating animation -->
      <animateTransform attributeName="transform" type="translate" values="450,70; 450,60; 450,70" dur="4s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D WebSocket visualization -->
    <g transform="translate(240,80)">
      <!-- Central WebSocket hub -->
      <g filter="url(#emboss-3d)">
        <circle cx="50" cy="50" r="35" fill="url(#websocket-3d)"/>
        <circle cx="50" cy="50" r="28" fill="#8338ec" opacity="0.8"/>
        
        <!-- WebSocket icon -->
        <circle cx="50" cy="50" r="15" fill="#ffffff" opacity="0.9"/>
        <text x="50" y="55" text-anchor="middle" fill="#8338ec" font-family="Arial, sans-serif" font-size="10" font-weight="bold">WS</text>
        
        <!-- Connection points -->
        <circle cx="20" cy="30" r="5" fill="#ff006e" opacity="0.8"/>
        <circle cx="80" cy="30" r="5" fill="#3a86ff" opacity="0.8"/>
        <circle cx="20" cy="70" r="5" fill="#06ffa5" opacity="0.8"/>
        <circle cx="80" cy="70" r="5" fill="#ffbe0b" opacity="0.8"/>
        
        <!-- Connection lines -->
        <line x1="25" y1="35" x2="45" y2="45" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        <line x1="75" y1="35" x2="55" y2="45" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        <line x1="25" y1="65" x2="45" y2="55" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        <line x1="75" y1="65" x2="55" y2="55" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        
        <!-- Data flow indicators -->
        <circle cx="32" cy="42" r="2" fill="#ffffff" opacity="0.8">
          <animateTransform attributeName="transform" type="translate" values="0,0; 18,8; 0,0" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="68" cy="58" r="2" fill="#ffffff" opacity="0.7">
          <animateTransform attributeName="transform" type="translate" values="0,0; -18,-8; 0,0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
      
      <!-- Pulsing animation -->
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.5s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D floating code snippets -->
    <g transform="translate(200,40)" opacity="0.7">
      <!-- Python/Django code -->
      <text x="0" y="25" fill="#06ffa5" font-family="Monaco, Consolas, monospace" font-size="12" font-weight="bold">async def</text>
      <text x="2" y="27" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="12" font-weight="bold" opacity="0.4">async def</text>
      
      <text x="20" y="45" fill="#ff006e" font-family="Monaco, Consolas, monospace" font-size="10">websocket_connect</text>
      <text x="22" y="47" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.3">websocket_connect</text>
      
      <text x="40" y="65" fill="#8338ec" font-family="Monaco, Consolas, monospace" font-size="10">await channel.send()</text>
      <text x="42" y="67" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.3">await channel.send()</text>
    </g>
    
    <!-- 3D main title with depth -->
    <g transform="translate(340,150)">
      <!-- Shadow text -->
      <text x="5" y="5" text-anchor="middle" fill="#8338ec" font-family="Arial, sans-serif" font-size="32" font-weight="900" opacity="0.3">
        Real-Time CodeSync
      </text>
      <!-- Main title -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="900">
        Real-Time CodeSync
      </text>
      <!-- Highlight overlay -->
      <text x="-2" y="-2" text-anchor="middle" fill="#ff006e" font-family="Arial, sans-serif" font-size="32" font-weight="900" opacity="0.7">
        Real-Time CodeSync
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(340,185)">
      <text x="2" y="2" text-anchor="middle" fill="#8338ec" font-family="Arial, sans-serif" font-size="18" font-weight="600" opacity="0.4">
        Django + WebSockets Collaboration
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="600">
        Django + WebSockets Collaboration
      </text>
    </g>
    
    <!-- 3D description -->
    <text x="340" y="215" text-anchor="middle" fill="#e1f5fe" font-family="Arial, sans-serif" font-size="13" opacity="0.9">
      Multi-user collaborative code editor with real-time synchronization
    </text>
    
    <!-- 3D collaboration status bar -->
    <g transform="translate(100,240)" opacity="0.5">
      <rect x="0" y="0" width="480" height="40" rx="8" fill="#000000" opacity="0.6"/>
      <rect x="2" y="-2" width="480" height="40" rx="8" fill="#1a1a1a" opacity="0.4"/>
      
      <!-- Connected users indicator -->
      <g transform="translate(20,15)">
        <circle cx="0" cy="5" r="4" fill="#ff006e" opacity="0.8"/>
        <text x="12" y="9" fill="#ff006e" font-family="Arial, sans-serif" font-size="10">Alice (editing)</text>
        
        <circle cx="100" cy="5" r="4" fill="#8338ec" opacity="0.8"/>
        <text x="112" y="9" fill="#8338ec" font-family="Arial, sans-serif" font-size="10">Bob (viewing)</text>
        
        <circle cx="220" cy="5" r="4" fill="#3a86ff" opacity="0.8"/>
        <text x="232" y="9" fill="#3a86ff" font-family="Arial, sans-serif" font-size="10">Carol (typing)</text>
        
        <!-- Connection status -->
        <circle cx="380" cy="5" r="3" fill="#06ffa5" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1s" repeatCount="indefinite"/>
        </circle>
        <text x="390" y="9" fill="#06ffa5" font-family="Arial, sans-serif" font-size="9">Connected</text>
      </g>
    </g>
  </g>
  
  <!-- 3D floating collaboration particles -->
  <g opacity="0.6">
    <circle cx="130" cy="110" r="3" fill="#ff006e">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,-18; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="200" r="2.5" fill="#8338ec">
      <animateTransform attributeName="transform" type="translate" values="0,0; -22,16; 0,0" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="330" r="4" fill="#3a86ff">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,22; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D light connection rays -->
  <g opacity="0.1">
    <polygon points="0,0 800,0 750,80 50,80" fill="url(#realtime-bg)"/>
    <polygon points="0,400 800,400 750,320 50,320" fill="url(#realtime-bg)"/>
  </g>
</svg>
