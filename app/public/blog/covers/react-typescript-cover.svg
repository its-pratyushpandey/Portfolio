<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#201d66;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#80deea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="650" cy="300" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="700" cy="80" r="40" fill="rgba(255,255,255,0.12)"/>
  
  <!-- Main content card -->
  <rect x="80" y="80" width="640" height="240" rx="20" fill="url(#card-gradient)" stroke="rgba(32,29,102,0.2)" stroke-width="2"/>
  
  <!-- React logo -->
  <g transform="translate(120, 120)">
    <circle cx="40" cy="40" r="8" fill="#61dafb"/>
    <ellipse cx="40" cy="40" rx="24" ry="10" fill="none" stroke="#61dafb" stroke-width="2"/>
    <ellipse cx="40" cy="40" rx="24" ry="10" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(60 40 40)"/>
    <ellipse cx="40" cy="40" rx="24" ry="10" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(120 40 40)"/>
  </g>
  
  <!-- TypeScript logo -->
  <g transform="translate(580, 120)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#3178c6"/>
    <text x="40" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">TS</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="160" text-anchor="middle" fill="#201d66" font-family="Arial, sans-serif" font-size="32" font-weight="bold">
    Building Modern React Apps
  </text>
  <text x="400" y="190" text-anchor="middle" fill="#3949ab" font-family="Arial, sans-serif" font-size="24">
    with TypeScript
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="230" text-anchor="middle" fill="#201d66" font-family="Arial, sans-serif" font-size="16">
    A comprehensive guide to scalable development
  </text>
  
  <!-- Code snippet decoration -->
  <rect x="120" y="260" width="560" height="40" rx="8" fill="rgba(32,29,102,0.1)" stroke="rgba(32,29,102,0.2)" stroke-width="1"/>
  <text x="130" y="280" fill="#201d66" font-family="monospace" font-size="14">
    const App: React.FC = () => { return &lt;Component /&gt;; }
  </text>
</svg>
