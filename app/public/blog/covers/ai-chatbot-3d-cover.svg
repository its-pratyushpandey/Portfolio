<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Futuristic gradient background -->
    <linearGradient id="future-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#16537e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a7289;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- Holographic glass -->
    <linearGradient id="holo-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#80deea;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Neon circuit gradient -->
    <linearGradient id="circuit-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8000ff;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Digital brain gradient -->
    <radialGradient id="brain-digital" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#e91e63;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#9c27b0;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#3f51b5;stop-opacity:0.6" />
    </radialGradient>
    
    <!-- Cyberpunk glow -->
    <filter id="cyber-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- 3D circuit emboss -->
    <filter id="circuit-emboss" x="-50%" y="-50%" width="200%" height="200%">
      <feConvolveMatrix order="3" kernelMatrix="1 1 1 1 1 1 1 1 1" divisor="9"/>
      <feOffset dx="1" dy="1"/>
      <feFlood flood-color="#00ffff" flood-opacity="0.4"/>
      <feComposite operator="multiply"/>
    </filter>
    
    <!-- Data stream animation -->
    <pattern id="data-stream" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <text x="10" y="15" text-anchor="middle" fill="#00ffff" font-family="Monaco, Consolas, monospace" font-size="8" opacity="0.6">01</text>
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 0,-20; 0,0" dur="2s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  
  <!-- Futuristic background -->
  <rect width="800" height="400" fill="url(#future-bg)"/>
  
  <!-- Digital grid overlay -->
  <g opacity="0.1">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#80deea" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>
  
  <!-- Floating 3D tech elements -->
  <g opacity="0.2">
    <!-- 3D tech cubes -->
    <g transform="translate(100,80)">
      <!-- Isometric cube with circuit patterns -->
      <polygon points="0,0 40,0 50,10 10,10" fill="#00ffff" opacity="0.6"/>
      <polygon points="40,0 40,40 50,50 50,10" fill="#0080ff" opacity="0.8"/>
      <polygon points="0,0 0,40 10,50 10,10" fill="#8000ff" opacity="0.7"/>
      
      <!-- Circuit lines on cube -->
      <line x1="5" y1="5" x2="35" y2="5" stroke="#00ffff" stroke-width="1" opacity="0.8"/>
      <line x1="5" y1="25" x2="35" y2="25" stroke="#0080ff" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- 3D digital diamonds -->
    <g transform="translate(650,120)">
      <polygon points="30,0 60,30 30,60 0,30" fill="url(#circuit-neon)" opacity="0.7"/>
      <polygon points="30,10 50,30 30,50 10,30" fill="#ffffff" opacity="0.3"/>
      
      <!-- Rotating animation -->
      <animateTransform attributeName="transform" type="rotate" values="0 30 30;360 30 30" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Main holographic interface -->
  <g transform="translate(50,50)">
    <!-- Multiple depth layers -->
    <rect x="20" y="20" width="680" height="300" rx="25" fill="#0080ff" opacity="0.1"/>
    <rect x="15" y="15" width="680" height="300" rx="25" fill="#00ffff" opacity="0.08"/>
    <rect x="10" y="10" width="680" height="300" rx="25" fill="#8000ff" opacity="0.06"/>
    
    <!-- Main interface panel -->
    <rect x="0" y="0" width="680" height="300" rx="20" fill="url(#holo-glass)" 
          stroke="rgba(0,255,255,0.4)" stroke-width="2" filter="url(#cyber-glow)"/>
    
    <!-- Digital AI brain visualization -->
    <g transform="translate(80,60)">
      <!-- Brain neural network -->
      <g fill="none" stroke="url(#brain-digital)" stroke-width="2" filter="url(#cyber-glow)">
        <!-- Brain outline with digital segments -->
        <path d="M50,20 Q30,0 70,0 Q110,0 130,20 Q150,40 130,60 Q110,80 90,100 Q70,120 50,100 Q30,80 30,60 Q30,40 50,20"/>
        
        <!-- Neural pathways -->
        <path d="M60,30 Q80,20 100,30 Q120,40 100,60 Q80,70 60,60 Q40,50 60,30"/>
        <path d="M70,45 Q85,35 95,45 Q105,55 95,65 Q85,75 75,65 Q65,55 70,45"/>
      </g>
      
      <!-- Digital synapses (animated) -->
      <circle cx="60" cy="40" r="3" fill="#ff1744">
        <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="50" r="2.5" fill="#e91e63">
        <animate attributeName="r" values="2.5;5;2.5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="75" cy="70" r="3.5" fill="#9c27b0">
        <animate attributeName="r" values="3.5;6.5;3.5" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Data streams connecting nodes -->
      <g stroke="#00ffff" stroke-width="1" opacity="0.6">
        <line x1="60" y1="40" x2="90" y2="50">
          <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="3s" repeatCount="indefinite"/>
        </line>
        <line x1="90" y1="50" x2="75" y2="70">
          <animate attributeName="stroke-dasharray" values="0,80;40,40;80,0" dur="2.5s" repeatCount="indefinite"/>
        </line>
        <line x1="75" y1="70" x2="60" y2="40">
          <animate attributeName="stroke-dasharray" values="0,120;60,60;120,0" dur="3.5s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
    
    <!-- Futuristic code interface -->
    <g transform="translate(250,40)">
      <!-- Holographic terminal -->
      <rect x="0" y="0" width="380" height="160" rx="12" fill="#000815" stroke="#00ffff" stroke-width="1" opacity="0.9" filter="url(#circuit-emboss)"/>
      
      <!-- Terminal header with cyberpunk styling -->
      <rect x="0" y="0" width="380" height="30" rx="12" fill="#001122"/>
      <circle cx="20" cy="15" r="5" fill="#ff1744"/>
      <circle cx="40" cy="15" r="5" fill="#ffa500"/>
      <circle cx="60" cy="15" r="5" fill="#00ff00"/>
      <text x="80" y="20" fill="#00ffff" font-family="Monaco, Consolas, monospace" font-size="12" font-weight="bold">AI_CHATBOT_CORE.js</text>
      
      <!-- AI code with syntax highlighting -->
      <text x="15" y="50" fill="#ff1744" font-family="Monaco, Consolas, monospace" font-size="11">
        <tspan>class</tspan> <tspan fill="#00ffff">IntelligentChatbot</tspan> <tspan fill="#ffffff">{</tspan>
      </text>
      <text x="25" y="70" fill="#e91e63" font-family="Monaco, Consolas, monospace" font-size="11">
        <tspan>constructor</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#9c27b0">apiKey</tspan><tspan fill="#ffffff">) {</tspan>
      </text>
      <text x="35" y="90" fill="#00ffff" font-family="Monaco, Consolas, monospace" font-size="11">
        <tspan>this.gpt4</tspan> <tspan fill="#ffffff">=</tspan> <tspan fill="#ffa500">new</tspan> <tspan fill="#3f51b5">OpenAI</tspan><tspan fill="#ffffff">(apiKey);</tspan>
      </text>
      <text x="25" y="110" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="11">}</text>
      <text x="25" y="130" fill="#e91e63" font-family="Monaco, Consolas, monospace" font-size="11">
        <tspan>async</tspan> <tspan fill="#00ffff">generateResponse</tspan><tspan fill="#ffffff">() {</tspan>
      </text>
      <text x="35" y="150" fill="#9c27b0" font-family="Monaco, Consolas, monospace" font-size="11">
        <tspan>return</tspan> <tspan fill="#ffffff">await this.gpt4.create();</tspan>
      </text>
      
      <!-- Blinking cursor with neon effect -->
      <rect x="275" y="138" width="2" height="15" fill="#00ffff" filter="url(#cyber-glow)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- AI chat interface mockup -->
    <g transform="translate(450,220)">
      <!-- Chat window -->
      <rect x="0" y="0" width="180" height="60" rx="8" fill="#001122" stroke="#00ffff" stroke-width="1" opacity="0.8"/>
      
      <!-- Chat bubbles with AI responses -->
      <rect x="10" y="10" width="160" height="15" rx="8" fill="#0080ff" opacity="0.7"/>
      <text x="15" y="22" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">AI: How can I help you today?</text>
      
      <rect x="10" y="30" width="160" height="15" rx="8" fill="#00ffff" opacity="0.5"/>
      <text x="15" y="42" fill="#000000" font-family="Arial, sans-serif" font-size="10">User: Build a React chatbot</text>
    </g>
    
    <!-- 3D holographic title -->
    <g transform="translate(340,210)">
      <!-- Glitch effect layers -->
      <text x="3" y="3" text-anchor="middle" fill="#ff1744" font-family="Arial, sans-serif" font-size="34" font-weight="900" opacity="0.3">
        Building Intelligent AI Chatbots
      </text>
      <text x="-2" y="1" text-anchor="middle" fill="#00ffff" font-family="Arial, sans-serif" font-size="34" font-weight="900" opacity="0.4">
        Building Intelligent AI Chatbots
      </text>
      <!-- Main title with cyberpunk glow -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="900" filter="url(#cyber-glow)">
        Building Intelligent AI Chatbots
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(340,245)">
      <text x="1" y="1" text-anchor="middle" fill="#0080ff" font-family="Arial, sans-serif" font-size="22" font-weight="600" opacity="0.6">
        with OpenAI GPT-4 & React
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#00ffff" font-family="Arial, sans-serif" font-size="22" font-weight="600">
        with OpenAI GPT-4 & React
      </text>
    </g>
    
    <!-- Tech description -->
    <text x="340" y="270" text-anchor="middle" fill="#80deea" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
      Next-generation conversational AI powered by cutting-edge technology
    </text>
  </g>
  
  <!-- Floating AI data particles -->
  <g opacity="0.8">
    <!-- Binary data streams -->
    <g transform="translate(120,150)">
      <text x="0" y="0" fill="#00ffff" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.7">101010</text>
      <animateTransform attributeName="transform" type="translate" values="120,150; 140,130; 120,150" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(650,250)">
      <text x="0" y="0" fill="#ff1744" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.6">110011</text>
      <animateTransform attributeName="transform" type="translate" values="650,250; 630,230; 650,250" dur="4s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(180,320)">
      <text x="0" y="0" fill="#9c27b0" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.8">AI</text>
      <animateTransform attributeName="transform" type="translate" values="180,320; 200,340; 180,320" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Cyberpunk scan lines -->
  <g opacity="0.15">
    <line x1="0" y1="150" x2="800" y2="150" stroke="#00ffff" stroke-width="1">
      <animate attributeName="y1" values="0;400;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;400;0" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#ff1744" stroke-width="1">
      <animate attributeName="y1" values="400;0;400" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="400;0;400" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Data stream pattern overlay -->
  <rect x="0" y="0" width="800" height="400" fill="url(#data-stream)" opacity="0.05"/>
</svg>
