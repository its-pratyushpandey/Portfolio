<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai-web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#673ab7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#ai-web-bg)"/>
  
  <rect x="80" y="80" width="640" height="240" rx="20" fill="rgba(255,255,255,0.95)" stroke="rgba(103,58,183,0.3)" stroke-width="2"/>
  
  <!-- AI brain with web elements -->
  <g transform="translate(120, 120)">
    <circle cx="25" cy="25" r="20" fill="none" stroke="#673ab7" stroke-width="3"/>
    <circle cx="20" cy="20" r="2" fill="#673ab7"/>
    <circle cx="30" cy="20" r="2" fill="#673ab7"/>
    <circle cx="25" cy="30" r="2" fill="#673ab7"/>
    <path d="M 15 25 Q 25 15 35 25" fill="none" stroke="#673ab7" stroke-width="2"/>
  </g>
  
  <!-- Web symbols -->
  <g transform="translate(550, 130)">
    <rect x="0" y="0" width="50" height="30" rx="6" fill="#9c27b0" opacity="0.8"/>
    <text x="25" y="20" text-anchor="middle" fill="white" font-family="Arial" font-size="12">&lt;/&gt;</text>
  </g>
  
  <text x="400" y="180" text-anchor="middle" fill="#673ab7" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    AI in Modern Web Dev
  </text>
  <text x="400" y="210" text-anchor="middle" fill="#9c27b0" font-family="Arial, sans-serif" font-size="20">
    Machine Learning APIs &amp; Integration
  </text>
  
  <text x="400" y="250" text-anchor="middle" fill="#e91e63" font-family="Arial, sans-serif" font-size="16">
    Practical implementation strategies for intelligent web apps
  </text>
</svg>
