<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modern-web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#03a9f4;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009688;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#modern-web-bg)"/>
  
  <rect x="80" y="80" width="640" height="240" rx="20" fill="rgba(255,255,255,0.95)" stroke="rgba(33,150,243,0.3)" stroke-width="2"/>
  
  <!-- Modern web tech icons -->
  <g transform="translate(120, 120)">
    <!-- React -->
    <circle cx="20" cy="20" r="15" fill="#61dafb"/>
    <circle cx="20" cy="20" r="3" fill="#000"/>
    <ellipse cx="20" cy="20" rx="10" ry="4" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="20" cy="20" rx="10" ry="4" fill="none" stroke="#000" stroke-width="1" transform="rotate(60 20 20)"/>
    <ellipse cx="20" cy="20" rx="10" ry="4" fill="none" stroke="#000" stroke-width="1" transform="rotate(120 20 20)"/>
  </g>
  
  <!-- Future/rocket icon -->
  <g transform="translate(580, 120)">
    <path d="M 20 10 L 30 40 L 20 35 L 10 40 Z" fill="#2196f3"/>
    <circle cx="20" cy="20" r="4" fill="#03a9f4"/>
    <path d="M 15 45 Q 20 50 25 45" fill="none" stroke="#ff9800" stroke-width="2"/>
  </g>
  
  <text x="400" y="180" text-anchor="middle" fill="#2196f3" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Modern Web Development
  </text>
  <text x="400" y="210" text-anchor="middle" fill="#03a9f4" font-family="Arial, sans-serif" font-size="20">
    Building Future Digital Experiences
  </text>
  
  <text x="400" y="250" text-anchor="middle" fill="#00bcd4" font-family="Arial, sans-serif" font-size="16">
    React, TypeScript, performance optimization, and emerging tech
  </text>
</svg>
