<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enterprise-grade gradient -->
    <linearGradient id="enterprise-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Microservices glass effect -->
    <linearGradient id="micro-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="50%" style="stop-color:#4fc3f7;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.08" />
    </linearGradient>
    
    <!-- Service node gradient -->
    <radialGradient id="service-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4fc3f7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3f51b5;stop-opacity:0.6" />
    </radialGradient>
    
    <!-- Data flow gradient -->
    <linearGradient id="data-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff5722;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#e91e63;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#9c27b0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Architecture glow -->
    <filter id="arch-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- 3D circuit emboss -->
    <filter id="circuit-3d" x="-50%" y="-50%" width="200%" height="200%">
      <feConvolveMatrix order="3" kernelMatrix="1 1 1 1 1 1 1 1 1" divisor="9"/>
      <feOffset dx="2" dy="2"/>
      <feFlood flood-color="#4fc3f7" flood-opacity="0.4"/>
      <feComposite operator="multiply"/>
    </filter>
    
    <!-- Database cylinder gradient -->
    <linearGradient id="db-cylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976d2;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- API gateway gradient -->
    <linearGradient id="api-gateway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2e7d32;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Enterprise background -->
  <rect width="800" height="400" fill="url(#enterprise-bg)"/>
  
  <!-- Microservices architecture grid -->
  <g opacity="0.1">
    <defs>
      <pattern id="arch-grid" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#4fc3f7" stroke-width="1"/>
        <circle cx="25" cy="25" r="2" fill="#00e676" opacity="0.6"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#arch-grid)"/>
  </g>
  
  <!-- Floating 3D microservice containers -->
  <g opacity="0.2">
    <!-- Container 1 -->
    <g transform="translate(80,60)">
      <rect x="0" y="0" width="40" height="40" rx="6" fill="url(#service-node)" opacity="0.7"/>
      <rect x="5" y="5" width="30" height="30" rx="4" fill="#ffffff" opacity="0.2"/>
      <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="8">API</text>
    </g>
    
    <!-- Container 2 -->
    <g transform="translate(650,80)">
      <rect x="0" y="0" width="45" height="45" rx="8" fill="url(#data-flow)" opacity="0.6"/>
      <rect x="6" y="6" width="33" height="33" rx="5" fill="#ffffff" opacity="0.15"/>
      <text x="22" y="28" text-anchor="middle" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="8">DB</text>
    </g>
    
    <!-- Container 3 -->
    <g transform="translate(120,320)">
      <rect x="0" y="0" width="50" height="35" rx="6" fill="url(#api-gateway)" opacity="0.8"/>
      <rect x="5" y="5" width="40" height="25" rx="4" fill="#ffffff" opacity="0.2"/>
      <text x="25" y="22" text-anchor="middle" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="7">AUTH</text>
    </g>
  </g>
  
  <!-- Main architecture panel -->
  <g transform="translate(60,60)">
    <!-- Multi-layer depth effect -->
    <rect x="20" y="20" width="660" height="280" rx="25" fill="#4fc3f7" opacity="0.08"/>
    <rect x="15" y="15" width="660" height="280" rx="25" fill="#00e676" opacity="0.06"/>
    <rect x="10" y="10" width="660" height="280" rx="25" fill="#9c27b0" opacity="0.05"/>
    
    <!-- Main panel surface -->
    <rect x="0" y="0" width="660" height="280" rx="20" fill="url(#micro-glass)" 
          stroke="rgba(79,195,247,0.4)" stroke-width="2" filter="url(#arch-glow)"/>
    
    <!-- Microservices architecture diagram -->
    <g transform="translate(50,40)">
      <!-- API Gateway (top center) -->
      <g transform="translate(250,0)">
        <rect x="0" y="0" width="120" height="40" rx="8" fill="url(#api-gateway)" filter="url(#circuit-3d)"/>
        <text x="60" y="15" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">API GATEWAY</text>
        <text x="60" y="30" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="8">Load Balancer</text>
        
        <!-- Glowing animation -->
        <rect x="0" y="0" width="120" height="40" rx="8" fill="none" stroke="#4caf50" stroke-width="2" opacity="0.6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </rect>
      </g>
      
      <!-- Microservices row -->
      <g transform="translate(0,80)">
        <!-- User Service -->
        <g transform="translate(0,0)">
          <circle cx="40" cy="40" r="30" fill="url(#service-node)" opacity="0.9"/>
          <circle cx="40" cy="40" r="25" fill="none" stroke="#00e676" stroke-width="2" opacity="0.7"/>
          <text x="40" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">USER</text>
          <text x="40" y="48" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="7">SERVICE</text>
        </g>
        
        <!-- Product Service -->
        <g transform="translate(150,0)">
          <circle cx="40" cy="40" r="30" fill="url(#service-node)" opacity="0.9"/>
          <circle cx="40" cy="40" r="25" fill="none" stroke="#00e676" stroke-width="2" opacity="0.7"/>
          <text x="40" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">PRODUCT</text>
          <text x="40" y="48" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="7">SERVICE</text>
        </g>
        
        <!-- Order Service -->
        <g transform="translate(300,0)">
          <circle cx="40" cy="40" r="30" fill="url(#service-node)" opacity="0.9"/>
          <circle cx="40" cy="40" r="25" fill="none" stroke="#00e676" stroke-width="2" opacity="0.7"/>
          <text x="40" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">ORDER</text>
          <text x="40" y="48" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="7">SERVICE</text>
        </g>
        
        <!-- Payment Service -->
        <g transform="translate(450,0)">
          <circle cx="40" cy="40" r="30" fill="url(#service-node)" opacity="0.9"/>
          <circle cx="40" cy="40" r="25" fill="none" stroke="#00e676" stroke-width="2" opacity="0.7"/>
          <text x="40" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">PAYMENT</text>
          <text x="40" y="48" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="7">SERVICE</text>
        </g>
      </g>
      
      <!-- Database layer -->
      <g transform="translate(0,180)">
        <!-- User DB -->
        <g transform="translate(20,0)">
          <ellipse cx="20" cy="15" rx="20" ry="8" fill="url(#db-cylinder)"/>
          <rect x="0" y="7" width="40" height="16" fill="url(#db-cylinder)" opacity="0.8"/>
          <ellipse cx="20" cy="23" rx="20" ry="8" fill="url(#db-cylinder)" opacity="0.6"/>
          <text x="20" y="19" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="7">USER_DB</text>
        </g>
        
        <!-- Product DB -->
        <g transform="translate(170,0)">
          <ellipse cx="20" cy="15" rx="20" ry="8" fill="url(#db-cylinder)"/>
          <rect x="0" y="7" width="40" height="16" fill="url(#db-cylinder)" opacity="0.8"/>
          <ellipse cx="20" cy="23" rx="20" ry="8" fill="url(#db-cylinder)" opacity="0.6"/>
          <text x="20" y="19" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="7">PROD_DB</text>
        </g>
        
        <!-- Order DB -->
        <g transform="translate(320,0)">
          <ellipse cx="20" cy="15" rx="20" ry="8" fill="url(#db-cylinder)"/>
          <rect x="0" y="7" width="40" height="16" fill="url(#db-cylinder)" opacity="0.8"/>
          <ellipse cx="20" cy="23" rx="20" ry="8" fill="url(#db-cylinder)" opacity="0.6"/>
          <text x="20" y="19" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="7">ORDER_DB</text>
        </g>
        
        <!-- Payment DB -->
        <g transform="translate(470,0)">
          <ellipse cx="20" cy="15" rx="20" ry="8" fill="url(#db-cylinder)"/>
          <rect x="0" y="7" width="40" height="16" fill="url(#db-cylinder)" opacity="0.8"/>
          <ellipse cx="20" cy="23" rx="20" ry="8" fill="url(#db-cylinder)" opacity="0.6"/>
          <text x="20" y="19" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="7">PAY_DB</text>
        </g>
      </g>
      
      <!-- Connection lines with data flow animation -->
      <g stroke="url(#data-flow)" stroke-width="2" opacity="0.7">
        <!-- API Gateway to Services -->
        <line x1="310" y1="40" x2="40" y2="120">
          <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="3s" repeatCount="indefinite"/>
        </line>
        <line x1="310" y1="40" x2="190" y2="120">
          <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        </line>
        <line x1="310" y1="40" x2="340" y2="120">
          <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="3s" begin="1s" repeatCount="indefinite"/>
        </line>
        <line x1="310" y1="40" x2="490" y2="120">
          <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        </line>
        
        <!-- Services to Databases -->
        <line x1="40" y1="160" x2="40" y2="180"/>
        <line x1="190" y1="160" x2="190" y2="180"/>
        <line x1="340" y1="160" x2="340" y2="180"/>
        <line x1="490" y1="160" x2="490" y2="180"/>
      </g>
    </g>
    
    <!-- Technology stack indicators -->
    <g transform="translate(500,200)">
      <rect x="0" y="0" width="120" height="60" rx="8" fill="rgba(0,0,0,0.6)" stroke="#4fc3f7" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TECH STACK</text>
      <text x="10" y="30" fill="#00e676" font-family="Monaco, Consolas, monospace" font-size="8">• Node.js</text>
      <text x="10" y="42" fill="#ff9800" font-family="Monaco, Consolas, monospace" font-size="8">• Docker</text>
      <text x="10" y="54" fill="#9c27b0" font-family="Monaco, Consolas, monospace" font-size="8">• Kubernetes</text>
      
      <text x="70" y="30" fill="#2196f3" font-family="Monaco, Consolas, monospace" font-size="8">• MongoDB</text>
      <text x="70" y="42" fill="#ff5722" font-family="Monaco, Consolas, monospace" font-size="8">• Redis</text>
      <text x="70" y="54" fill="#4caf50" font-family="Monaco, Consolas, monospace" font-size="8">• Nginx</text>
    </g>
  </g>
  
  <!-- 3D architectural title -->
  <g transform="translate(400,320)">
    <!-- Shadow layers for depth -->
    <text x="3" y="3" text-anchor="middle" fill="#0a0a0f" font-family="Arial, sans-serif" font-size="32" font-weight="900" opacity="0.5">
      Advanced Full-Stack Development
    </text>
    <text x="-1" y="1" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="32" font-weight="900" opacity="0.7">
      Advanced Full-Stack Development
    </text>
    <!-- Main title -->
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="900" filter="url(#arch-glow)">
      Advanced Full-Stack Development
    </text>
  </g>
  
  <!-- 3D subtitle -->
  <g transform="translate(400,355)">
    <text x="1" y="1" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="20" font-weight="600" opacity="0.8">
      Scalable Microservices Architecture
    </text>
    <text x="0" y="0" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="20" font-weight="600">
      Scalable Microservices Architecture
    </text>
  </g>
  
  <!-- Enterprise tagline -->
  <text x="400" y="380" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="12" opacity="0.9">
    Enterprise-grade architecture patterns for modern web applications
  </text>
  
  <!-- Floating system metrics -->
  <g opacity="0.8">
    <!-- Performance metrics -->
    <g transform="translate(120,100)">
      <text x="0" y="0" fill="#00e676" font-family="Monaco, Consolas, monospace" font-size="10" font-weight="bold">99.9%</text>
      <text x="0" y="12" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="8">Uptime</text>
      <animateTransform attributeName="transform" type="translate" values="120,100; 130,90; 120,100" dur="4s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(600,180)">
      <text x="0" y="0" fill="#ff9800" font-family="Monaco, Consolas, monospace" font-size="10" font-weight="bold">10K</text>
      <text x="0" y="12" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="8">RPS</text>
      <animateTransform attributeName="transform" type="translate" values="600,180; 590,170; 600,180" dur="3.5s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(150,320)">
      <text x="0" y="0" fill="#9c27b0" font-family="Monaco, Consolas, monospace" font-size="10" font-weight="bold">&lt;50ms</text>
      <text x="0" y="12" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="8">Latency</text>
      <animateTransform attributeName="transform" type="translate" values="150,320; 160,330; 150,320" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Data flow particles -->
  <g opacity="0.4">
    <circle cx="250" cy="150" r="2" fill="#4fc3f7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-15; 0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="200" r="1.5" fill="#00e676">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,10; 0,0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="120" r="2.5" fill="#ff9800">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,12; 0,0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- System monitoring overlay -->
  <g opacity="0.15">
    <line x1="0" y1="200" x2="800" y2="200" stroke="#4fc3f7" stroke-width="1">
      <animate attributeName="y1" values="0;400;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;400;0" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
