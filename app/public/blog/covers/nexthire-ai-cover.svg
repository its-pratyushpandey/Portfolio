<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional Dark 3D Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D Glass Card Effect -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
    </linearGradient>
    
    <!-- AI Tech Accent Gradient -->
    <linearGradient id="aiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5b73ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Neural Network Glow -->
    <filter id="neuralGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 3D Shadow Filter -->
    <filter id="shadow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Professional Dark Background -->
  <rect width="800" height="400" fill="url(#darkBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Neural Network Background -->
  <g opacity="0.4" filter="url(#neuralGlow)">
    <!-- AI Nodes -->
    <circle cx="120" cy="80" r="8" fill="url(#aiAccent)"/>
    <circle cx="180" cy="60" r="6" fill="url(#aiAccent)"/>
    <circle cx="140" cy="130" r="7" fill="url(#aiAccent)"/>
    <circle cx="220" cy="110" r="5" fill="url(#aiAccent)"/>
    <circle cx="260" cy="150" r="4" fill="url(#aiAccent)"/>
    
    <!-- AI Network Connections -->
    <path d="M 120 80 Q 150 70 180 60" stroke="url(#aiAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 120 80 Q 130 105 140 130" stroke="url(#aiAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 180 60 Q 200 85 220 110" stroke="url(#aiAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 140 130 Q 200 140 260 150" stroke="url(#aiAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Right side neural pattern -->
    <circle cx="680" cy="320" r="6" fill="url(#aiAccent)"/>
    <circle cx="720" cy="300" r="5" fill="url(#aiAccent)"/>
    <circle cx="650" cy="350" r="4" fill="url(#aiAccent)"/>
    <path d="M 680 320 Q 700 310 720 300" stroke="url(#aiAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 680 320 Q 665 335 650 350" stroke="url(#aiAccent)" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Main 3D Glass Card -->
  <g filter="url(#shadow3d)">
    <rect x="60" y="70" width="680" height="260" rx="24" fill="url(#glassCard)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="60" y="70" width="680" height="1" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Modern MERN Stack Icons with 3D Effect -->
  <g transform="translate(120, 130)">
    <!-- MongoDB -->
    <circle cx="20" cy="20" r="22" fill="rgba(71,162,72,0.2)" stroke="#47A248" stroke-width="2"/>
    <rect x="8" y="8" width="24" height="24" rx="6" fill="#47A248"/>
    <text x="20" y="26" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="700">M</text>
  </g>
  
  <g transform="translate(200, 130)">
    <!-- Express -->
    <circle cx="20" cy="20" r="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <rect x="8" y="8" width="24" height="24" rx="6" fill="rgba(255,255,255,0.9)"/>
    <text x="20" y="26" text-anchor="middle" fill="#000" font-family="system-ui" font-size="14" font-weight="700">E</text>
  </g>
  
  <g transform="translate(280, 130)">
    <!-- React -->
    <circle cx="20" cy="20" r="22" fill="rgba(97,218,251,0.2)" stroke="#61DAFB" stroke-width="2"/>
    <circle cx="20" cy="20" r="18" fill="#61DAFB" opacity="0.9"/>
    <circle cx="20" cy="20" r="3" fill="#000"/>
    <ellipse cx="20" cy="20" rx="10" ry="4" fill="none" stroke="#000" stroke-width="1.5"/>
    <ellipse cx="20" cy="20" rx="10" ry="4" fill="none" stroke="#000" stroke-width="1.5" transform="rotate(60 20 20)"/>
    <ellipse cx="20" cy="20" rx="10" ry="4" fill="none" stroke="#000" stroke-width="1.5" transform="rotate(120 20 20)"/>
  </g>
  
  <g transform="translate(360, 130)">
    <!-- Node.js -->
    <circle cx="20" cy="20" r="22" fill="rgba(51,153,51,0.2)" stroke="#339933" stroke-width="2"/>
    <rect x="8" y="8" width="24" height="24" rx="6" fill="#339933"/>
    <text x="20" y="26" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="700">N</text>
  </g>
  
  <!-- AI Brain Icon with Glow -->
  <g transform="translate(560, 130)" filter="url(#neuralGlow)">
    <circle cx="20" cy="20" r="22" fill="rgba(157,78,221,0.3)" stroke="url(#aiAccent)" stroke-width="2"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="url(#aiAccent)" stroke-width="2.5"/>
    <circle cx="15" cy="15" r="2.5" fill="url(#aiAccent)"/>
    <circle cx="25" cy="15" r="2.5" fill="url(#aiAccent)"/>
    <circle cx="20" cy="25" r="2.5" fill="url(#aiAccent)"/>
    <path d="M 12 20 Q 20 12 28 20" fill="none" stroke="url(#aiAccent)" stroke-width="2"/>
    <path d="M 15 26 Q 20 18 25 26" fill="none" stroke="url(#aiAccent)" stroke-width="1.5"/>
  </g>
  
  <!-- Main Title with Professional Typography -->
  <text x="400" y="220" text-anchor="middle" fill="rgba(255,255,255,0.95)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    NextHire: AI Recruitment
  </text>
  <text x="400" y="250" text-anchor="middle" fill="url(#aiAccent)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
    Built with MERN Stack &amp; OpenAI
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="280" text-anchor="middle" fill="rgba(255,255,255,0.7)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    Architecture, AI Features &amp; Implementation Deep Dive
  </text>
  
  <!-- Modern Feature Pills -->
  <g transform="translate(140, 300)">
    <rect width="90" height="24" rx="12" fill="rgba(0,212,255,0.2)" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="12" font-weight="600">Resume AI</text>
  </g>
  
  <g transform="translate(250, 300)">
    <rect width="110" height="24" rx="12" fill="rgba(91,115,255,0.2)" stroke="rgba(91,115,255,0.4)" stroke-width="1"/>
    <text x="55" y="16" text-anchor="middle" fill="#5b73ff" font-family="system-ui" font-size="12" font-weight="600">Job Matching</text>
  </g>
  
  <g transform="translate(380, 300)">
    <rect width="85" height="24" rx="12" fill="rgba(157,78,221,0.2)" stroke="rgba(157,78,221,0.4)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" fill="#9d4edd" font-family="system-ui" font-size="12" font-weight="600">Real-time</text>
  </g>
  
  <g transform="translate(485, 300)">
    <rect width="85" height="24" rx="12" fill="rgba(0,212,255,0.2)" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="12" font-weight="600">Hackathon</text>
  </g>
</svg>
