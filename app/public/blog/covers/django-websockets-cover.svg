<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional Dark 3D Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D Glass Card Effect -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
    </linearGradient>
    
    <!-- Django Green Accent -->
    <linearGradient id="djangoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c7c59;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d8456;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f9d58;stop-opacity:1" />
    </linearGradient>
    
    <!-- WebSocket Connection Gradient -->
    <linearGradient id="wsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5b73ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Real-time Glow -->
    <filter id="realtimeGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 3D Shadow Filter -->
    <filter id="shadow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Professional Dark Background -->
  <rect width="800" height="400" fill="url(#darkBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Real-time Connection Lines -->
  <g opacity="0.5" filter="url(#realtimeGlow)">
    <!-- Data Flow Visualization -->
    <path d="M 100 200 Q 200 150 300 200 Q 400 250 500 200 Q 600 150 700 200" 
          stroke="url(#wsAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 100 200 Q 200 250 300 200 Q 400 150 500 200 Q 600 250 700 200" 
          stroke="url(#djangoAccent)" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Connection Nodes -->
    <circle cx="150" cy="180" r="6" fill="url(#wsAccent)"/>
    <circle cx="300" cy="200" r="8" fill="url(#djangoAccent)"/>
    <circle cx="500" cy="200" r="8" fill="url(#wsAccent)"/>
    <circle cx="650" cy="220" r="6" fill="url(#djangoAccent)"/>
    
    <!-- Real-time pulse animations -->
    <circle cx="400" cy="200" r="4" fill="url(#wsAccent)" opacity="0.8"/>
    <circle cx="400" cy="200" r="8" fill="none" stroke="url(#wsAccent)" stroke-width="1" opacity="0.4"/>
    <circle cx="400" cy="200" r="12" fill="none" stroke="url(#wsAccent)" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Main 3D Glass Card -->
  <g filter="url(#shadow3d)">
    <rect x="60" y="70" width="680" height="260" rx="24" fill="url(#glassCard)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="60" y="70" width="680" height="1" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Modern Django Icon -->
  <g transform="translate(130, 135)" filter="url(#realtimeGlow)">
    <rect x="0" y="0" width="80" height="30" rx="8" fill="rgba(9,46,32,0.3)" stroke="url(#djangoAccent)" stroke-width="2"/>
    <rect x="2" y="2" width="76" height="26" rx="6" fill="#092e20"/>
    <text x="40" y="20" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="700">Django</text>
  </g>
  
  <!-- Python Logo -->
  <g transform="translate(250, 140)" filter="url(#realtimeGlow)">
    <circle cx="20" cy="15" r="18" fill="rgba(55,118,171,0.3)" stroke="#3776ab" stroke-width="2"/>
    <circle cx="20" cy="15" r="14" fill="#3776ab"/>
    <circle cx="15" cy="10" r="3" fill="#ffd343"/>
    <circle cx="25" cy="20" r="3" fill="#ffd343"/>
    <path d="M 10 15 Q 20 5 30 15" fill="none" stroke="#ffd343" stroke-width="2"/>
  </g>
  
  <!-- WebSocket Connection Visualization -->
  <g transform="translate(480, 135)" filter="url(#realtimeGlow)">
    <!-- Connected Nodes -->
    <circle cx="20" cy="15" r="16" fill="rgba(0,212,255,0.3)" stroke="url(#wsAccent)" stroke-width="2"/>
    <circle cx="20" cy="15" r="12" fill="url(#wsAccent)"/>
    <circle cx="60" cy="15" r="16" fill="rgba(91,115,255,0.3)" stroke="url(#wsAccent)" stroke-width="2"/>
    <circle cx="60" cy="15" r="12" fill="url(#wsAccent)"/>
    
    <!-- Real-time Connection -->
    <path d="M 36 15 Q 40 8 44 15" fill="none" stroke="url(#wsAccent)" stroke-width="3"/>
    <path d="M 36 15 Q 40 22 44 15" fill="none" stroke="url(#wsAccent)" stroke-width="3"/>
    <circle cx="40" cy="15" r="2" fill="white"/>
  </g>
  
  <!-- Code Editor Representation -->
  <g transform="translate(580, 140)" filter="url(#realtimeGlow)">
    <rect x="0" y="0" width="50" height="30" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect x="2" y="2" width="46" height="4" rx="2" fill="rgba(0,212,255,0.6)"/>
    <rect x="2" y="8" width="30" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="2" y="12" width="36" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="2" y="16" width="25" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="2" y="20" width="40" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="42" cy="25" r="2" fill="#4caf50"/>
  </g>
  
  <!-- Main Title with Professional Typography -->
  <text x="400" y="210" text-anchor="middle" fill="rgba(255,255,255,0.95)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    Real-Time CodeSync
  </text>
  <text x="400" y="240" text-anchor="middle" fill="url(#wsAccent)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
    Django &amp; WebSockets Collaboration
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="270" text-anchor="middle" fill="rgba(255,255,255,0.7)" 
        font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    Multi-user Editing &amp; Live Synchronization Techniques
  </text>
  
  <!-- Modern Feature Pills -->
  <g transform="translate(150, 300)">
    <rect width="85" height="24" rx="12" fill="rgba(12,124,89,0.2)" stroke="rgba(12,124,89,0.4)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" fill="#0c7c59" font-family="system-ui" font-size="12" font-weight="600">Django</text>
  </g>
  
  <g transform="translate(255, 300)">
    <rect width="100" height="24" rx="12" fill="rgba(0,212,255,0.2)" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
    <text x="50" y="16" text-anchor="middle" fill="#00d4ff" font-family="system-ui" font-size="12" font-weight="600">WebSockets</text>
  </g>
  
  <g transform="translate(375, 300)">
    <rect width="85" height="24" rx="12" fill="rgba(91,115,255,0.2)" stroke="rgba(91,115,255,0.4)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" fill="#5b73ff" font-family="system-ui" font-size="12" font-weight="600">Real-time</text>
  </g>
  
  <g transform="translate(480, 300)">
    <rect width="80" height="24" rx="12" fill="rgba(55,118,171,0.2)" stroke="rgba(55,118,171,0.4)" stroke-width="1"/>
    <text x="40" y="16" text-anchor="middle" fill="#3776ab" font-family="system-ui" font-size="12" font-weight="600">Python</text>
  </g>
  
  <g transform="translate(580, 300)">
    <rect width="90" height="24" rx="12" fill="rgba(157,78,221,0.2)" stroke="rgba(157,78,221,0.4)" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" fill="#9d4edd" font-family="system-ui" font-size="12" font-weight="600">Collaboration</text>
  </g>
</svg>
