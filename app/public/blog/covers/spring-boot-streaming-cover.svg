<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spring-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6db33f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#201d66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spring-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f1f8e9;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#spring-bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="650" cy="300" r="40" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="250" width="60" height="60" rx="12" fill="rgba(255,255,255,0.1)" transform="rotate(30 80 280)"/>
  
  <!-- Main content card -->
  <rect x="80" y="80" width="640" height="240" rx="20" fill="url(#spring-card)" stroke="rgba(109,179,63,0.3)" stroke-width="2"/>
  
  <!-- Spring Boot logo -->
  <g transform="translate(120, 120)">
    <circle cx="40" cy="40" r="35" fill="#6db33f"/>
    <text x="40" y="50" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold">🍃</text>
  </g>
  
  <!-- Video/streaming icon -->
  <g transform="translate(580, 120)">
    <rect x="0" y="10" width="60" height="40" rx="8" fill="#3949ab"/>
    <polygon points="20,20 20,40 40,30" fill="white"/>
    <circle cx="50" cy="15" r="3" fill="#ff4444"/>
    <rect x="10" y="0" width="40" height="8" rx="4" fill="rgba(109,179,63,0.3)"/>
  </g>
  
  <!-- Database icon -->
  <g transform="translate(500, 130)">
    <ellipse cx="20" cy="10" rx="15" ry="5" fill="#ff9800"/>
    <rect x="5" y="10" width="30" height="20" fill="#ff9800"/>
    <ellipse cx="20" cy="30" rx="15" ry="5" fill="#ff9800"/>
    <ellipse cx="20" cy="20" rx="15" ry="5" fill="#ffb74d"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="180" text-anchor="middle" fill="#201d66" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Mastering Spring Boot
  </text>
  <text x="400" y="210" text-anchor="middle" fill="#6db33f" font-family="Arial, sans-serif" font-size="20">
    Building Scalable Video Streaming APIs
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="250" text-anchor="middle" fill="#201d66" font-family="Arial, sans-serif" font-size="16">
    Complete guide to file handling, optimization, and database design
  </text>
  
  <!-- Tech stack indicators -->
  <rect x="150" y="280" width="70" height="18" rx="9" fill="rgba(109,179,63,0.2)"/>
  <text x="185" y="292" text-anchor="middle" fill="#6db33f" font-family="Arial" font-size="11" font-weight="bold">Spring Boot</text>
  
  <rect x="240" y="280" width="50" height="18" rx="9" fill="rgba(57,73,171,0.2)"/>
  <text x="265" y="292" text-anchor="middle" fill="#3949ab" font-family="Arial" font-size="11" font-weight="bold">Java</text>
  
  <rect x="310" y="280" width="60" height="18" rx="9" fill="rgba(255,152,0,0.2)"/>
  <text x="340" y="292" text-anchor="middle" fill="#ff9800" font-family="Arial" font-size="11" font-weight="bold">MySQL</text>
  
  <rect x="390" y="280" width="70" height="18" rx="9" fill="rgba(57,73,171,0.2)"/>
  <text x="425" y="292" text-anchor="middle" fill="#3949ab" font-family="Arial" font-size="11" font-weight="bold">REST API</text>
  
  <rect x="480" y="280" width="80" height="18" rx="9" fill="rgba(255,68,68,0.2)"/>
  <text x="520" y="292" text-anchor="middle" fill="#ff4444" font-family="Arial" font-size="11" font-weight="bold">Video Stream</text>
  
  <!-- API endpoint illustration -->
  <rect x="200" y="300" width="400" height="25" rx="12" fill="rgba(32,29,102,0.1)" stroke="rgba(32,29,102,0.2)" stroke-width="1"/>
  <text x="210" y="315" fill="#201d66" font-family="monospace" font-size="12">
    GET /api/v1/videos/stream/{id} → High-performance streaming
  </text>
</svg>
