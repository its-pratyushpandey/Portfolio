<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium 3D gradients -->
    <linearGradient id="premium-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D glass effect -->
    <linearGradient id="glass-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- React logo 3D gradient -->
    <radialGradient id="react-3d" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#21232c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#282c34;stop-opacity:0.6" />
    </radialGradient>
    
    <!-- TypeScript 3D gradient -->
    <linearGradient id="ts-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3178c6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2562c4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1e4a8c;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 3D depth shadow -->
    <filter id="depth-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#667eea" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#764ba2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Inner glow -->
    <filter id="inner-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- 3D bevel effect -->
    <filter id="bevel-3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feSpecularLighting result="specOut" lighting-color="white" specularConstant="1.5" specularExponent="20">
        <fePointLight x="-50" y="-50" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  
  <!-- Premium 3D background -->
  <rect width="800" height="400" fill="url(#premium-bg)"/>
  
  <!-- Floating 3D isometric shapes -->
  <g opacity="0.12">
    <!-- Isometric cubes with 3D perspective -->
    <g transform="translate(80,60)">
      <polygon points="0,0 30,0 45,15 15,15" fill="#ffffff" opacity="0.8"/>
      <polygon points="30,0 30,30 45,45 45,15" fill="#f093fb" opacity="0.6"/>
      <polygon points="0,0 0,30 15,45 15,15" fill="#764ba2" opacity="0.7"/>
    </g>
    
    <!-- 3D diamond shapes -->
    <g transform="translate(650,90)">
      <polygon points="20,0 40,20 20,40 0,20" fill="#61dafb" opacity="0.5"/>
      <polygon points="20,0 30,10 20,20 10,10" fill="#ffffff" opacity="0.8"/>
    </g>
    
    <!-- 3D hexagons -->
    <g transform="translate(200,320)">
      <polygon points="25,0 45,10 45,30 25,40 5,30 5,10" fill="#3178c6" opacity="0.6"/>
      <polygon points="25,5 40,12 40,28 25,35 10,28 10,12" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Main 3D glassmorphism card -->
  <g transform="translate(50,50)">
    <!-- Multiple shadow layers for depth -->
    <rect x="20" y="20" width="680" height="300" rx="30" fill="#667eea" opacity="0.15" filter="url(#depth-shadow)"/>
    <rect x="15" y="15" width="680" height="300" rx="30" fill="#764ba2" opacity="0.1"/>
    <rect x="10" y="10" width="680" height="300" rx="30" fill="#f093fb" opacity="0.08"/>
    
    <!-- Main glass surface -->
    <rect x="0" y="0" width="680" height="300" rx="25" fill="url(#glass-3d)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#inner-glow)"/>
    
    <!-- 3D React logo with orbital rings -->
    <g transform="translate(80,80)">
      <!-- Orbital rings with 3D perspective -->
      <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.7" transform="rotate(0)"/>
      <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.6" transform="rotate(60)"/>
      <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.5" transform="rotate(120)"/>
      
      <!-- Central atom with 3D effect -->
      <circle cx="50" cy="50" r="12" fill="url(#react-3d)" filter="url(#bevel-3d)"/>
      <circle cx="50" cy="50" r="8" fill="#61dafb" opacity="0.9"/>
      <circle cx="47" cy="47" r="3" fill="#ffffff" opacity="0.8"/>
      
      <!-- Rotating animation -->
      <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="10s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D TypeScript logo -->
    <g transform="translate(520,80)">
      <!-- 3D cube base -->
      <g filter="url(#bevel-3d)">
        <rect x="0" y="0" width="100" height="100" rx="15" fill="url(#ts-3d)"/>
        <rect x="5" y="5" width="90" height="90" rx="12" fill="#3178c6" opacity="0.8"/>
        
        <!-- 3D TS text with depth -->
        <text x="50" y="65" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="bold">TS</text>
        <text x="52" y="67" text-anchor="middle" fill="#e1f5fe" font-family="Arial, sans-serif" font-size="48" font-weight="bold" opacity="0.7">TS</text>
      </g>
      
      <!-- Floating animation -->
      <animateTransform attributeName="transform" type="translate" values="520,80; 520,70; 520,80" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D floating code elements -->
    <g transform="translate(250,60)" opacity="0.6">
      <!-- JSX tags with 3D depth -->
      <text x="0" y="30" fill="#61dafb" font-family="Monaco, Consolas, monospace" font-size="16" font-weight="bold">&lt;Component</text>
      <text x="2" y="32" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="16" font-weight="bold" opacity="0.5">&lt;Component</text>
      
      <text x="20" y="60" fill="#f093fb" font-family="Monaco, Consolas, monospace" font-size="14">props={data}</text>
      <text x="22" y="62" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="14" opacity="0.4">props={data}</text>
      
      <text x="40" y="90" fill="#764ba2" font-family="Monaco, Consolas, monospace" font-size="16" font-weight="bold">/&gt;</text>
      <text x="42" y="92" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="16" font-weight="bold" opacity="0.3">/&gt;</text>
    </g>
    
    <!-- 3D gradient title with perspective -->
    <g transform="translate(340,170)">
      <!-- Shadow text for depth -->
      <text x="5" y="5" text-anchor="middle" fill="#667eea" font-family="Arial, sans-serif" font-size="40" font-weight="900" opacity="0.3">
        Building Modern React Apps
      </text>
      <!-- Main title -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="900">
        Building Modern React Apps
      </text>
      <!-- Highlight overlay -->
      <text x="-2" y="-2" text-anchor="middle" fill="#f093fb" font-family="Arial, sans-serif" font-size="40" font-weight="900" opacity="0.7">
        Building Modern React Apps
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(340,210)">
      <text x="2" y="2" text-anchor="middle" fill="#764ba2" font-family="Arial, sans-serif" font-size="26" font-weight="600" opacity="0.4">
        with TypeScript Excellence
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="600">
        with TypeScript Excellence
      </text>
    </g>
    
    <!-- 3D description text -->
    <text x="340" y="250" text-anchor="middle" fill="#e1f5fe" font-family="Arial, sans-serif" font-size="16" opacity="0.9">
      Professional-grade development patterns and best practices
    </text>
    
    <!-- 3D decorative code snippet -->
    <g transform="translate(100,230)" opacity="0.3">
      <rect x="0" y="0" width="480" height="40" rx="8" fill="#000000" opacity="0.6"/>
      <rect x="2" y="-2" width="480" height="40" rx="8" fill="#1a1a1a" opacity="0.4"/>
      <text x="10" y="25" fill="#61dafb" font-family="Monaco, Consolas, monospace" font-size="14">
        const App: React.FC&lt;Props&gt; = () =&gt; &lt;TypeSafeComponent /&gt;;
      </text>
    </g>
  </g>
  
  <!-- 3D floating particles with depth -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="3" fill="#f093fb">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-8; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="180" r="2.5" fill="#61dafb">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,10; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="350" r="4" fill="#3178c6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,15; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D light rays -->
  <g opacity="0.15">
    <polygon points="0,0 800,0 750,50 50,50" fill="url(#premium-bg)"/>
    <polygon points="0,400 800,400 750,350 50,350" fill="url(#premium-bg)"/>
  </g>
</svg>
