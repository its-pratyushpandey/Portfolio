<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional UI/UX design dark theme -->
    <linearGradient id="design-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#24243e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0c29;stop-opacity:1" />
    </linearGradient>
    
    <!-- Design gradient palette -->
    <linearGradient id="palette-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#fecfef;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#fecfef;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#ffc3a0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ff9a9e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Figma-inspired gradient -->
    <radialGradient id="figma-3d" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#f24e1e;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff7262;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#a259ff;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#1abcfe;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0acf83;stop-opacity:1" />
    </radialGradient>
    
    <!-- Modern glass effect for UI elements -->
    <linearGradient id="glass-ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="30%" style="stop-color:#ff9a9e;stop-opacity:0.12" />
      <stop offset="70%" style="stop-color:#a259ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
    
    <!-- Typography gradient -->
    <linearGradient id="typography-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 3D design glow effect -->
    <filter id="design-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Professional depth shadow -->
    <filter id="depth-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#a259ff" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff9a9e" flood-opacity="0.3"/>
    </filter>
    
    <!-- 3D emboss for design elements -->
    <filter id="emboss-3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feSpecularLighting result="specOut" lighting-color="white" specularConstant="2" specularExponent="25">
        <fePointLight x="-60" y="-60" z="250"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    
    <!-- Design grid pattern -->
    <pattern id="design-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#ff9a9e" stroke-width="0.5" opacity="0.3"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#a259ff" stroke-width="0.5" opacity="0.3"/>
      <circle cx="30" cy="30" r="2" fill="#1abcfe" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>
  
  <!-- Professional design background -->
  <rect width="800" height="400" fill="url(#design-bg)"/>
  
  <!-- Design grid overlay -->
  <g opacity="0.08">
    <rect width="100%" height="100%" fill="url(#design-grid)"/>
  </g>
  
  <!-- Floating 3D design elements -->
  <g opacity="0.15">
    <!-- Design tools -->
    <g transform="translate(60,70)">
      <!-- Pen tool -->
      <polygon points="10,5 20,0 25,10 15,15" fill="#f24e1e" opacity="0.8"/>
      <circle cx="17.5" cy="7.5" r="2" fill="#ffffff" opacity="0.6"/>
    </g>
    
    <!-- Color swatches -->
    <g transform="translate(680,90)">
      <rect x="0" y="0" width="15" height="15" rx="3" fill="#ff9a9e" opacity="0.7"/>
      <rect x="0" y="20" width="15" height="15" rx="3" fill="#a259ff" opacity="0.7"/>
      <rect x="0" y="40" width="15" height="15" rx="3" fill="#1abcfe" opacity="0.7"/>
    </g>
    
    <!-- Typography elements -->
    <g transform="translate(150,320)">
      <rect x="0" y="0" width="40" height="8" rx="2" fill="#667eea" opacity="0.6"/>
      <rect x="0" y="12" width="30" height="6" rx="2" fill="#764ba2" opacity="0.5"/>
      <rect x="0" y="22" width="35" height="6" rx="2" fill="#f093fb" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Main 3D container -->
  <g transform="translate(50,50)">
    <!-- Professional shadow layers -->
    <rect x="20" y="20" width="680" height="300" rx="30" fill="#a259ff" opacity="0.15" filter="url(#depth-shadow)"/>
    <rect x="15" y="15" width="680" height="300" rx="30" fill="#ff9a9e" opacity="0.1"/>
    <rect x="10" y="10" width="680" height="300" rx="30" fill="#1abcfe" opacity="0.08"/>
    
    <!-- Main glass surface -->
    <rect x="0" y="0" width="680" height="300" rx="25" fill="url(#glass-ui)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#design-glow)"/>
    
    <!-- 3D Figma logo representation -->
    <g transform="translate(70,80)">
      <g filter="url(#emboss-3d)">
        <!-- Figma shapes -->
        <circle cx="30" cy="20" r="15" fill="#f24e1e" opacity="0.9"/>
        <circle cx="60" cy="20" r="15" fill="#ff7262" opacity="0.8"/>
        <circle cx="30" cy="50" r="15" fill="#a259ff" opacity="0.9"/>
        <circle cx="60" cy="50" r="15" fill="#1abcfe" opacity="0.8"/>
        <circle cx="45" cy="35" r="12" fill="#0acf83" opacity="0.9"/>
        
        <!-- Figma text -->
        <text x="45" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Design Tools</text>
      </g>
      
      <!-- Floating animation */
      <animateTransform attributeName="transform" type="translate" values="70,80; 70,70; 70,80" dur="3.5s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D UI/UX principles visualization -->
    <g transform="translate(480,70)">
      <g filter="url(#emboss-3d)">
        <!-- Design principles stack -->
        <rect x="0" y="0" width="120" height="20" rx="10" fill="#ff9a9e" opacity="0.9"/>
        <text x="60" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">User-Centered</text>
        
        <rect x="0" y="25" width="120" height="20" rx="10" fill="#a259ff" opacity="0.9"/>
        <text x="60" y="39" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Accessible</text>
        
        <rect x="0" y="50" width="120" height="20" rx="10" fill="#1abcfe" opacity="0.9"/>
        <text x="60" y="64" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Responsive</text>
        
        <rect x="0" y="75" width="120" height="20" rx="10" fill="#0acf83" opacity="0.9"/>
        <text x="60" y="89" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Intuitive</text>
      </g>
      
      <!-- Stack animation */
      <animateTransform attributeName="transform" type="translate" values="480,70; 480,60; 480,70" dur="4s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D design process flow -->
    <g transform="translate(220,80)">
      <!-- Central design hub -->
      <g filter="url(#emboss-3d)">
        <circle cx="60" cy="50" r="35" fill="url(#figma-3d)"/>
        <circle cx="60" cy="50" r="28" fill="#a259ff" opacity="0.8"/>
        
        <!-- Design icon -->
        <circle cx="60" cy="50" r="15" fill="#ffffff" opacity="0.9"/>
        <polygon points="55,45 65,45 60,55" fill="#a259ff" opacity="0.8"/>
        <circle cx="60" cy="42" r="3" fill="#a259ff" opacity="0.8"/>
        
        <!-- Process steps -->
        <circle cx="25" cy="25" r="8" fill="#f24e1e" opacity="0.8"/>
        <text x="25" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">1</text>
        
        <circle cx="95" cy="25" r="8" fill="#ff7262" opacity="0.8"/>
        <text x="95" y="29" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">2</text>
        
        <circle cx="25" cy="75" r="8" fill="#1abcfe" opacity="0.8"/>
        <text x="25" y="79" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">3</text>
        
        <circle cx="95" cy="75" r="8" fill="#0acf83" opacity="0.8"/>
        <text x="95" y="79" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">4</text>
        
        <!-- Connection lines -->
        <line x1="33" y1="33" x2="52" y2="42" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        <line x1="87" y1="33" x2="68" y2="42" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        <line x1="33" y1="67" x2="52" y2="58" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        <line x1="87" y1="67" x2="68" y2="58" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
        
        <!-- Process flow animation */
        <circle cx="40" cy="40" r="2" fill="#ffffff" opacity="0.8">
          <animateTransform attributeName="transform" type="translate" values="0,0; 20,10; 0,0" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
      
      <!-- Central hub pulsing */
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D floating design concepts */
    <g transform="translate(200,30)" opacity="0.7">
      <!-- Design principles */
      <text x="0" y="25" fill="#f24e1e" font-family="Monaco, Consolas, monospace" font-size="12" font-weight="bold">Wireframing</text>
      <text x="2" y="27" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="12" font-weight="bold" opacity="0.4">Wireframing</text>
      
      <text x="20" y="45" fill="#a259ff" font-family="Monaco, Consolas, monospace" font-size="10">Prototyping</text>
      <text x="22" y="47" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.3">Prototyping</text>
      
      <text x="40" y="65" fill="#1abcfe" font-family="Monaco, Consolas, monospace" font-size="10">User Testing</text>
      <text x="42" y="67" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="10" opacity="0.3">User Testing</text>
    </g>
    
    <!-- 3D main title with depth -->
    <g transform="translate(340,155)">
      <!-- Shadow text -->
      <text x="5" y="5" text-anchor="middle" fill="#a259ff" font-family="Arial, sans-serif" font-size="34" font-weight="900" opacity="0.3">
        UI/UX Design Mastery
      </text>
      <!-- Main title -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="900">
        UI/UX Design Mastery
      </text>
      <!-- Highlight overlay -->
      <text x="-2" y="-2" text-anchor="middle" fill="#ff9a9e" font-family="Arial, sans-serif" font-size="34" font-weight="900" opacity="0.7">
        UI/UX Design Mastery
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(340,195)">
      <text x="2" y="2" text-anchor="middle" fill="#a259ff" font-family="Arial, sans-serif" font-size="20" font-weight="600" opacity="0.4">
        For Developer-Designers
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="600">
        For Developer-Designers
      </text>
    </g>
    
    <!-- 3D description -->
    <text x="340" y="225" text-anchor="middle" fill="#e1f5fe" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
      Essential design principles for creating intuitive and beautiful interfaces
    </text>
    
    <!-- 3D design process visualization -->
    <g transform="translate(100,230)" opacity="0.5">
      <rect x="0" y="0" width="480" height="50" rx="8" fill="#000000" opacity="0.6"/>
      <rect x="2" y="-2" width="480" height="50" rx="8" fill="#1a1a1a" opacity="0.4"/>
      
      <!-- Design process steps -->
      <g transform="translate(20,15)">
        <!-- Research -->
        <rect x="0" y="0" width="80" height="20" rx="10" fill="#f24e1e" opacity="0.8"/>
        <text x="40" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Research</text>
        
        <!-- Design -->
        <rect x="90" y="0" width="80" height="20" rx="10" fill="#a259ff" opacity="0.8"/>
        <text x="130" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Design</text>
        
        <!-- Prototype -->
        <rect x="180" y="0" width="80" height="20" rx="10" fill="#1abcfe" opacity="0.8"/>
        <text x="220" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Prototype</text>
        
        <!-- Test -->
        <rect x="270" y="0" width="80" height="20" rx="10" fill="#0acf83" opacity="0.8"/>
        <text x="310" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Test</text>
        
        <!-- Iterate */
        <rect x="360" y="0" width="80" height="20" rx="10" fill="#ff7262" opacity="0.8"/>
        <text x="400" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Iterate</text>
        
        <!-- Progress indicator -->
        <circle cx="450" cy="10" r="3" fill="#ffffff" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
  
  <!-- 3D floating design particles -->
  <g opacity="0.6">
    <circle cx="120" cy="100" r="3" fill="#f24e1e">
      <animateTransform attributeName="transform" type="translate" values="0,0; 28,-20; 0,0" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="180" r="2.5" fill="#a259ff">
      <animateTransform attributeName="transform" type="translate" values="0,0; -25,18; 0,0" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="340" r="4" fill="#1abcfe">
      <animateTransform attributeName="transform" type="translate" values="0,0; 22,25; 0,0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D light design rays -->
  <g opacity="0.12">
    <polygon points="0,0 800,0 750,70 50,70" fill="url(#design-bg)"/>
    <polygon points="0,400 800,400 750,330 50,330" fill="url(#design-bg)"/>
  </g>
</svg>
