<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Professional gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="future-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tech-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D shadows -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="6" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Holographic effect -->
    <filter id="hologram" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pulse animation -->
    <animate id="pulse" attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-gradient)"/>
  
  <!-- Digital grid background -->
  <g opacity="0.1">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="800" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Floating holographic interface -->
  <g transform="translate(100, 80)">
    <!-- Main holographic screen -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="200" rx="15" fill="rgba(139, 92, 246, 0.1)" stroke="url(#future-gradient)" stroke-width="2" filter="url(#shadow)"/>
      <rect x="10" y="10" width="280" height="180" rx="10" fill="rgba(139, 92, 246, 0.05)"/>
      
      <!-- Code visualization -->
      <g transform="translate(20, 30)">
        <!-- HTML structure -->
        <rect x="0" y="0" width="80" height="40" rx="8" fill="rgba(239, 68, 68, 0.8)" filter="url(#hologram)"/>
        <text x="40" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">HTML5</text>
        
        <!-- CSS styling -->
        <rect x="100" y="0" width="80" height="40" rx="8" fill="rgba(59, 130, 246, 0.8)" filter="url(#hologram)"/>
        <text x="140" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">CSS3</text>
        
        <!-- JavaScript logic -->
        <rect x="200" y="0" width="80" height="40" rx="8" fill="rgba(245, 158, 11, 0.8)" filter="url(#hologram)"/>
        <text x="240" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">JS ES6+</text>
        
        <!-- React component -->
        <rect x="50" y="60" width="80" height="40" rx="8" fill="rgba(6, 182, 212, 0.8)" filter="url(#hologram)"/>
        <text x="90" y="85" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">React</text>
        
        <!-- API integration -->
        <rect x="150" y="60" width="80" height="40" rx="8" fill="rgba(139, 92, 246, 0.8)" filter="url(#hologram)"/>
        <text x="190" y="85" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">APIs</text>
        
        <!-- Connection lines -->
        <g stroke="rgba(6, 182, 212, 0.6)" stroke-width="2" fill="none">
          <line x1="40" y1="40" x2="90" y2="60" opacity="0.8"/>
          <line x1="140" y1="40" x2="90" y2="60" opacity="0.8"/>
          <line x1="240" y1="40" x2="190" y2="60" opacity="0.8"/>
          <line x1="130" y1="80" x2="150" y2="80" opacity="0.8"/>
        </g>
      </g>
      
      <!-- Progress indicators -->
      <g transform="translate(20, 150)">
        <rect x="0" y="0" width="100" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
        <rect x="0" y="0" width="85" height="8" rx="4" fill="url(#tech-gradient)"/>
        <text x="110" y="6" fill="#06b6d4" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Performance: 85%</text>
        
        <rect x="0" y="20" width="100" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
        <rect x="0" y="20" width="92" height="8" rx="4" fill="url(#future-gradient)"/>
        <text x="110" y="26" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Innovation: 92%</text>
      </g>
    </g>
    
    <!-- Floating 3D elements -->
    <g transform="translate(350, 20)">
      <!-- Future tech cube -->
      <g transform="translate(0, 0)">
        <!-- Cube faces -->
        <rect x="0" y="20" width="60" height="60" fill="url(#future-gradient)" filter="url(#shadow)" opacity="0.9"/>
        <path d="M0 20 L20 0 L80 0 L60 20 Z" fill="rgba(139, 92, 246, 0.7)"/>
        <path d="M60 20 L80 0 L80 60 L60 80 Z" fill="rgba(139, 92, 246, 0.5)"/>
        
        <!-- Holographic elements -->
        <circle cx="30" cy="50" r="15" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#hologram)">
          <animate attributeName="r" values="10;20;10" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="50" r="8" fill="#06b6d4" opacity="0.6">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
      
      <!-- Digital pyramid -->
      <g transform="translate(100, 40)">
        <path d="M30 0 L0 60 L60 60 Z" fill="url(#tech-gradient)" filter="url(#shadow)" opacity="0.8"/>
        <path d="M30 0 L60 60 L70 50 L40 -10 Z" fill="rgba(6, 182, 212, 0.6)"/>
        
        <!-- Digital patterns -->
        <g stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none">
          <line x1="15" y1="30" x2="45" y2="30"/>
          <line x1="20" y1="40" x2="40" y2="40"/>
          <line x1="25" y1="50" x2="35" y2="50"/>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Future technologies showcase -->
  <g transform="translate(450, 250)">
    <!-- WebAssembly -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="rgba(102, 51, 153, 0.8)" filter="url(#shadow)"/>
      <text x="40" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">WebAssembly</text>
    </g>
    
    <!-- PWA -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="60" height="30" rx="15" fill="rgba(16, 185, 129, 0.8)" filter="url(#shadow)"/>
      <text x="30" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">PWA</text>
    </g>
    
    <!-- WebRTC -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="70" height="30" rx="15" fill="rgba(245, 158, 11, 0.8)" filter="url(#shadow)"/>
      <text x="35" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">WebRTC</text>
    </g>
    
    <!-- Machine Learning -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="100" height="30" rx="15" fill="rgba(236, 72, 153, 0.8)" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">TensorFlow.js</text>
    </g>
    
    <!-- Blockchain -->
    <g transform="translate(160, 40)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="rgba(139, 92, 246, 0.8)" filter="url(#shadow)"/>
      <text x="40" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Web3</text>
    </g>
  </g>
  
  <!-- Particle effects -->
  <g opacity="0.4">
    <circle cx="200" cy="50" r="2" fill="#8b5cf6" filter="url(#hologram)">
      <animate attributeName="cy" values="50;350;50" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="100" r="3" fill="#06b6d4" filter="url(#hologram)">
      <animate attributeName="cy" values="100;300;100" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="350" r="2" fill="#f59e0b" filter="url(#hologram)">
      <animate attributeName="cy" values="350;50;350" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title section -->
  <g transform="translate(50, 30)">
    <text x="0" y="0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold" opacity="0.9">
      Modern Web Development
    </text>
    <text x="0" y="30" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="16" font-weight="500">
      Building the Future of Digital Experiences
    </text>
  </g>
  
  <!-- Professional badges -->
  <g transform="translate(600, 20)">
    <rect x="0" y="0" width="80" height="25" rx="12" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="40" y="17" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Future Tech
    </text>
  </g>
  
  <g transform="translate(690, 20)">
    <rect x="0" y="0" width="80" height="25" rx="12" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1"/>
    <text x="40" y="17" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Innovation
    </text>
  </g>
</svg>
