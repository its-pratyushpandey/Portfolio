<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- AI-powered recruitment dark theme -->
    <linearGradient id="nexthire-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1015;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2a2f4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3f6a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Professional AI gradient -->
    <radialGradient id="ai-core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ff6b96;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#c44cda;stop-opacity:0.9" />
      <stop offset="80%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.7" />
    </radialGradient>
    
    <!-- Modern glass effect -->
    <linearGradient id="glass-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="30%" style="stop-color:#ff6b96;stop-opacity:0.12" />
      <stop offset="70%" style="stop-color:#8b5cf6;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Neural network connections -->
    <linearGradient id="neural-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5b21b6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- MERN stack gradient -->
    <linearGradient id="mern-stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:0.9" />
      <stop offset="25%" style="stop-color:#68d391;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.7" />
      <stop offset="75%" style="stop-color:#f87171;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 3D AI glow effect -->
    <filter id="ai-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Professional depth shadow -->
    <filter id="depth-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#8b5cf6" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff6b96" flood-opacity="0.3"/>
    </filter>
    
    <!-- 3D emboss effect -->
    <filter id="emboss-3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feSpecularLighting result="specOut" lighting-color="white" specularConstant="1.8" specularExponent="25">
        <fePointLight x="-60" y="-60" z="250"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    
    <!-- AI data pattern -->
    <pattern id="ai-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="10" cy="10" r="1.5" fill="#ff6b96" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="10" r="1.5" fill="#8b5cf6" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="30" r="1.5" fill="#3b82f6" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <line x1="10" y1="10" x2="30" y2="10" stroke="#ff6b96" stroke-width="0.5" opacity="0.3"/>
      <line x1="20" y1="10" x2="20" y2="30" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Professional AI background -->
  <rect width="800" height="400" fill="url(#nexthire-bg)"/>
  
  <!-- AI neural network overlay -->
  <g opacity="0.08">
    <rect width="100%" height="100%" fill="url(#ai-pattern)"/>
  </g>
  
  <!-- Floating 3D elements -->
  <g opacity="0.15">
    <!-- AI brain nodes -->
    <g transform="translate(70,70)">
      <circle cx="20" cy="20" r="15" fill="#ff6b96" opacity="0.6"/>
      <circle cx="20" cy="20" r="10" fill="#ffffff" opacity="0.4"/>
      <circle cx="18" cy="18" r="3" fill="#ff6b96" opacity="0.9"/>
    </g>
    
    <!-- Data cubes -->
    <g transform="translate(680,90)">
      <polygon points="0,0 25,0 35,10 10,10" fill="#8b5cf6" opacity="0.7"/>
      <polygon points="25,0 25,25 35,35 35,10" fill="#3b82f6" opacity="0.8"/>
      <polygon points="0,0 0,25 10,35 10,10" fill="#ff6b96" opacity="0.6"/>
    </g>
    
    <!-- Resume icons -->
    <g transform="translate(150,320)">
      <rect x="0" y="0" width="20" height="30" rx="3" fill="#61dafb" opacity="0.5"/>
      <rect x="3" y="5" width="14" height="2" fill="#ffffff" opacity="0.7"/>
      <rect x="3" y="10" width="10" height="2" fill="#ffffff" opacity="0.6"/>
      <rect x="3" y="15" width="12" height="2" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>
  
  <!-- Main 3D container -->
  <g transform="translate(50,50)">
    <!-- Professional shadow layers -->
    <rect x="20" y="20" width="680" height="300" rx="30" fill="#8b5cf6" opacity="0.15" filter="url(#depth-shadow)"/>
    <rect x="15" y="15" width="680" height="300" rx="30" fill="#ff6b96" opacity="0.1"/>
    <rect x="10" y="10" width="680" height="300" rx="30" fill="#3b82f6" opacity="0.08"/>
    
    <!-- Main glass surface -->
    <rect x="0" y="0" width="680" height="300" rx="25" fill="url(#glass-ai)" 
          stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#ai-glow)"/>
    
    <!-- 3D AI brain visualization -->
    <g transform="translate(70,80)">
      <!-- Central AI core -->
      <g filter="url(#emboss-3d)">
        <circle cx="50" cy="50" r="40" fill="url(#ai-core)"/>
        <circle cx="50" cy="50" r="32" fill="#8b5cf6" opacity="0.8"/>
        
        <!-- Neural connections -->
        <g opacity="0.9">
          <line x1="25" y1="35" x2="75" y2="65" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
          <line x1="35" y1="75" x2="65" y2="25" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
          <line x1="15" y1="50" x2="85" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
          <line x1="50" y1="15" x2="50" y2="85" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
        </g>
        
        <!-- AI nodes -->
        <circle cx="25" cy="35" r="4" fill="#ffffff" opacity="0.9"/>
        <circle cx="75" cy="65" r="4" fill="#ffffff" opacity="0.8"/>
        <circle cx="35" cy="75" r="4" fill="#ffffff" opacity="0.7"/>
        <circle cx="65" cy="25" r="4" fill="#ffffff" opacity="0.9"/>
        
        <!-- Central processing unit -->
        <circle cx="50" cy="50" r="8" fill="#ffffff" opacity="0.9"/>
        <text x="50" y="55" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="8" font-weight="bold">AI</text>
      </g>
      
      <!-- Pulsing animation -->
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D MERN Stack representation -->
    <g transform="translate(520,80)">
      <!-- Stack layers with 3D effect -->
      <g filter="url(#emboss-3d)">
        <!-- MongoDB (M) -->
        <rect x="0" y="0" width="80" height="20" rx="10" fill="#68d391" opacity="0.9"/>
        <text x="40" y="14" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">MongoDB</text>
        
        <!-- Express (E) -->
        <rect x="0" y="25" width="80" height="20" rx="10" fill="#fbbf24" opacity="0.9"/>
        <text x="40" y="39" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Express</text>
        
        <!-- React (R) -->
        <rect x="0" y="50" width="80" height="20" rx="10" fill="#61dafb" opacity="0.9"/>
        <text x="40" y="64" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="12" font-weight="bold">React</text>
        
        <!-- Node.js (N) -->
        <rect x="0" y="75" width="80" height="20" rx="10" fill="#68d391" opacity="0.9"/>
        <text x="40" y="89" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Node.js</text>
      </g>
      
      <!-- Stack floating animation -->
      <animateTransform attributeName="transform" type="translate" values="520,80; 520,70; 520,80" dur="4s" repeatCount="indefinite"/>
    </g>
    
    <!-- 3D recruitment features -->
    <g transform="translate(250,60)" opacity="0.7">
      <!-- Resume parsing -->
      <text x="0" y="25" fill="#ff6b96" font-family="Monaco, Consolas, monospace" font-size="14" font-weight="bold">Resume Parser</text>
      <text x="2" y="27" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="14" font-weight="bold" opacity="0.4">Resume Parser</text>
      
      <!-- Job matching -->
      <text x="20" y="50" fill="#8b5cf6" font-family="Monaco, Consolas, monospace" font-size="12">Job Matching AI</text>
      <text x="22" y="52" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="12" opacity="0.3">Job Matching AI</text>
      
      <!-- Real-time features -->
      <text x="40" y="75" fill="#3b82f6" font-family="Monaco, Consolas, monospace" font-size="12">Real-time Chat</text>
      <text x="42" y="77" fill="#ffffff" font-family="Monaco, Consolas, monospace" font-size="12" opacity="0.3">Real-time Chat</text>
    </g>
    
    <!-- 3D main title with depth -->
    <g transform="translate(340,150)">
      <!-- Shadow text -->
      <text x="5" y="5" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="34" font-weight="900" opacity="0.3">
        NextHire AI Platform
      </text>
      <!-- Main title -->
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="900">
        NextHire AI Platform
      </text>
      <!-- Highlight overlay -->
      <text x="-2" y="-2" text-anchor="middle" fill="#ff6b96" font-family="Arial, sans-serif" font-size="34" font-weight="900" opacity="0.7">
        NextHire AI Platform
      </text>
    </g>
    
    <!-- 3D subtitle -->
    <g transform="translate(340,190)">
      <text x="2" y="2" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="20" font-weight="600" opacity="0.4">
        MERN Stack + OpenAI Integration
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="600">
        MERN Stack + OpenAI Integration
      </text>
    </g>
    
    <!-- 3D description -->
    <text x="340" y="225" text-anchor="middle" fill="#e1f5fe" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
      AI-powered recruitment with intelligent matching and real-time features
    </text>
    
    <!-- 3D feature showcase -->
    <g transform="translate(100,210)" opacity="0.4">
      <rect x="0" y="0" width="480" height="60" rx="8" fill="#000000" opacity="0.6"/>
      <rect x="2" y="-2" width="480" height="60" rx="8" fill="#1a1a1a" opacity="0.4"/>
      
      <!-- AI features visualization -->
      <g transform="translate(20,20)">
        <!-- Resume analysis -->
        <circle cx="0" cy="10" r="6" fill="#ff6b96" opacity="0.8">
          <animate attributeName="r" values="6;4;8;6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="15" y="15" fill="#ff6b96" font-family="Arial, sans-serif" font-size="10">Resume Analysis</text>
        
        <!-- Job matching -->
        <circle cx="140" cy="10" r="6" fill="#8b5cf6" opacity="0.8">
          <animate attributeName="r" values="6;8;4;6" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="155" y="15" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="10">Smart Matching</text>
        
        <!-- Real-time communication -->
        <circle cx="280" cy="10" r="6" fill="#3b82f6" opacity="0.8">
          <animate attributeName="r" values="6;5;7;6" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="295" y="15" fill="#3b82f6" font-family="Arial, sans-serif" font-size="10">Real-time Chat</text>
        
        <!-- Connection lines -->
        <line x1="6" y1="10" x2="134" y2="10" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
        <line x1="146" y1="10" x2="274" y2="10" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      </g>
    </g>
  </g>
  
  <!-- 3D floating AI particles -->
  <g opacity="0.6">
    <circle cx="120" cy="100" r="3" fill="#ff6b96">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-15; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="180" r="2.5" fill="#8b5cf6">
      <animateTransform attributeName="transform" type="translate" values="0,0; -18,12; 0,0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="340" r="4" fill="#3b82f6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,20; 0,0" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D light rays -->
  <g opacity="0.12">
    <polygon points="0,0 800,0 750,70 50,70" fill="url(#nexthire-bg)"/>
    <polygon points="0,400 800,400 750,330 50,330" fill="url(#nexthire-bg)"/>
  </g>
</svg>
