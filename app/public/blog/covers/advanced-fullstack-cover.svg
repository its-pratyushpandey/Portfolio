<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fullstack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5722;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#fullstack-bg)"/>
  
  <rect x="80" y="80" width="640" height="240" rx="20" fill="rgba(255,255,255,0.95)" stroke="rgba(255,87,34,0.3)" stroke-width="2"/>
  
  <!-- Full-stack layers visualization -->
  <g transform="translate(120, 120)">
    <rect x="0" y="30" width="50" height="8" rx="4" fill="#2196f3" opacity="0.8"/>
    <rect x="0" y="20" width="50" height="8" rx="4" fill="#4caf50" opacity="0.8"/>
    <rect x="0" y="10" width="50" height="8" rx="4" fill="#ffc107" opacity="0.8"/>
    <rect x="0" y="0" width="50" height="8" rx="4" fill="#ff5722" opacity="0.8"/>
    <text x="60" y="20" fill="#ff5722" font-family="Arial" font-size="10">Full-Stack</text>
  </g>
  
  <!-- Microservices representation -->
  <g transform="translate(550, 130)">
    <circle cx="15" cy="15" r="8" fill="#ff9800" opacity="0.8"/>
    <circle cx="35" cy="15" r="8" fill="#4caf50" opacity="0.8"/>
    <circle cx="25" cy="30" r="8" fill="#2196f3" opacity="0.8"/>
    <line x1="15" y1="15" x2="35" y2="15" stroke="#666" stroke-width="1"/>
    <line x1="15" y1="15" x2="25" y2="30" stroke="#666" stroke-width="1"/>
    <line x1="35" y1="15" x2="25" y2="30" stroke="#666" stroke-width="1"/>
  </g>
  
  <text x="400" y="180" text-anchor="middle" fill="#ff5722" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Advanced Full-Stack Development
  </text>
  <text x="400" y="210" text-anchor="middle" fill="#ff9800" font-family="Arial, sans-serif" font-size="20">
    Scalable Web Applications
  </text>
  
  <text x="400" y="250" text-anchor="middle" fill="#4caf50" font-family="Arial, sans-serif" font-size="16">
    Microservices, database optimization, and deployment strategies
  </text>
</svg>
