<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#201d66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#fff3e0;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#ai-bg)"/>
  
  <!-- Decorative neural network nodes -->
  <g opacity="0.3">
    <circle cx="100" cy="100" r="6" fill="white"/>
    <circle cx="150" cy="80" r="4" fill="white"/>
    <circle cx="120" cy="140" r="5" fill="white"/>
    <circle cx="180" cy="120" r="4" fill="white"/>
    <circle cx="200" cy="160" r="3" fill="white"/>
    
    <line x1="100" y1="100" x2="150" y2="80" stroke="white" stroke-width="1"/>
    <line x1="100" y1="100" x2="120" y2="140" stroke="white" stroke-width="1"/>
    <line x1="150" y1="80" x2="180" y2="120" stroke="white" stroke-width="1"/>
    <line x1="120" y1="140" x2="200" y2="160" stroke="white" stroke-width="1"/>
    
    <circle cx="650" cy="300" r="5" fill="white"/>
    <circle cx="680" cy="280" r="4" fill="white"/>
    <circle cx="620" cy="320" r="3" fill="white"/>
    <line x1="650" y1="300" x2="680" y2="280" stroke="white" stroke-width="1"/>
    <line x1="650" y1="300" x2="620" y2="320" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Main content card -->
  <rect x="80" y="80" width="640" height="240" rx="20" fill="url(#ai-card)" stroke="rgba(255,107,53,0.3)" stroke-width="2"/>
  
  <!-- MERN Stack icons -->
  <g transform="translate(120, 120)">
    <!-- MongoDB -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#47A248"/>
    <text x="20" y="28" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">M</text>
  </g>
  
  <g transform="translate(180, 120)">
    <!-- Express -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#000000"/>
    <text x="20" y="28" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">E</text>
  </g>
  
  <g transform="translate(240, 120)">
    <!-- React -->
    <circle cx="20" cy="20" r="20" fill="#61DAFB"/>
    <circle cx="20" cy="20" r="4" fill="#000"/>
    <ellipse cx="20" cy="20" rx="12" ry="5" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="20" cy="20" rx="12" ry="5" fill="none" stroke="#000" stroke-width="1" transform="rotate(60 20 20)"/>
    <ellipse cx="20" cy="20" rx="12" ry="5" fill="none" stroke="#000" stroke-width="1" transform="rotate(120 20 20)"/>
  </g>
  
  <g transform="translate(300, 120)">
    <!-- Node.js -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#339933"/>
    <text x="20" y="28" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">N</text>
  </g>
  
  <!-- AI Brain icon -->
  <g transform="translate(580, 120)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <circle cx="15" cy="15" r="2" fill="#ff6b35"/>
    <circle cx="25" cy="15" r="2" fill="#ff6b35"/>
    <circle cx="20" cy="25" r="2" fill="#ff6b35"/>
    <path d="M 10 20 Q 20 10 30 20" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <path d="M 15 25 Q 20 15 25 25" fill="none" stroke="#ff6b35" stroke-width="1"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="200" text-anchor="middle" fill="#201d66" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    NextHire: AI Recruitment Platform
  </text>
  <text x="400" y="230" text-anchor="middle" fill="#ff6b35" font-family="Arial, sans-serif" font-size="20">
    Built with MERN Stack &amp; OpenAI
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="270" text-anchor="middle" fill="#201d66" font-family="Arial, sans-serif" font-size="16">
    Technical deep dive: Architecture, AI features, and implementation insights
  </text>
  
  <!-- Feature tags -->
  <rect x="150" y="290" width="80" height="20" rx="10" fill="rgba(255,107,53,0.2)"/>
  <text x="190" y="302" text-anchor="middle" fill="#ff6b35" font-family="Arial" font-size="12" font-weight="bold">Resume AI</text>
  
  <rect x="250" y="290" width="100" height="20" rx="10" fill="rgba(255,107,53,0.2)"/>
  <text x="300" y="302" text-anchor="middle" fill="#ff6b35" font-family="Arial" font-size="12" font-weight="bold">Job Matching</text>
  
  <rect x="370" y="290" width="80" height="20" rx="10" fill="rgba(255,107,53,0.2)"/>
  <text x="410" y="302" text-anchor="middle" fill="#ff6b35" font-family="Arial" font-size="12" font-weight="bold">Real-time</text>
  
  <rect x="470" y="290" width="80" height="20" rx="10" fill="rgba(255,107,53,0.2)"/>
  <text x="510" y="302" text-anchor="middle" fill="#ff6b35" font-family="Arial" font-size="12" font-weight="bold">Hackathon</text>
</svg>
